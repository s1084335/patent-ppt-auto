// failed 點卡看錯誤原因（job.error_message）。詳情用狀態欄位判斷，不寫死特定 job_id。
const HIDDEN_TASK_STATUSES = new Set(['succeeded']);  // succeeded 過濾掉，其餘保留
let taskById = {};  // job_id -> 任務物件，供點擊展開詳情查閱 error_message／stage
function isHiddenTask(t) { return HIDDEN_TASK_STATUSES.has(t.status); }
function taskCardHtml(t) {
  const statusCls = 'status-' + (t.status || 'queued');
  const pct = t.progress_percent ?? 0;
  const stage = t.current_stage || '';
  // 任一狀態都可點開詳情；failed 看原因、running/queued 看階段與進度。
  return '<div class="task-card task-clickable" data-run-id="' + t.job_id + '"'
    + ' onclick="toggleTaskDetail(' + t.job_id + ')" title="點擊查看詳情">'
    + '<div class="task-card-header">'
    + '<span class="task-type">' + escHtml(t.job_type) + ' #' + escHtml(t.job_id) + '</span>'
    + '<span class="task-status ' + statusCls + '">' + escHtml(t.status) + '</span>'
    + '</div>'
    + '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="task-meta"><span>' + escHtml(stage) + '</span><span class="elapsed"></span></div>'
    + '<div class="task-detail" data-detail-for="' + t.job_id + '" style="display:none"></div>'
    + '</div>';
}
// 點卡展開／收合詳情：failed 顯示 error_message，其餘顯示目前階段與進度。
function toggleTaskDetail(runId) {
  const box = document.querySelector('.task-detail[data-detail-for="' + runId + '"]');
  if (!box) return;
  if (box.style.display !== 'none') { box.style.display = 'none'; return; }
  const t = taskById[runId] || {};
  let html;
  if (t.status === 'failed' || t.status === 'cancelled') {
    const reason = t.error_message || '（無錯誤訊息）';
    html = '<div class="task-detail-title">失敗原因</div>'
      + '<div class="task-detail-error">' + escHtml(reason) + '</div>';
  } else {
    html = '<div class="task-detail-title">目前進度</div>'
      + '<div>階段：' + escHtml(t.current_stage || '—')
      + '　進度：' + (t.progress_percent ?? 0) + '%</div>';
  }
  box.innerHTML = html;
  box.style.display = 'block';
}
function renderTaskList(tasks) {
  const c = el('task-container');
  if (!c) return;
  // 先過濾 succeeded，再建 id 索引供詳情查閱。
  const visible = (tasks || []).filter(t => !isHiddenTask(t));
  taskById = {};
  (tasks || []).forEach(t => { taskById[t.job_id] = t; });
  if (visible.length === 0) { c.innerHTML = '<div class="task-empty">尚無進行中或待處理任務</div>'; return; }
  c.innerHTML = visible.map(taskCardHtml).join('');
}
// SSE 進度事件即時更新對應卡片（progress/status/stage）；轉為 succeeded 時整卡移除。
function updateTaskFromEvent(ev) {
  const cached = taskById[ev.run_id];
  if (cached) {
    if (ev.status) cached.status = ev.status;
    if (ev.stage) cached.current_stage = ev.stage;
    const p = ev.progress ?? ev.progress_percent;
    if (p !== undefined && p !== null) cached.progress_percent = p;
    if (ev.error_message !== undefined) cached.error_message = ev.error_message;
  }
  const card = document.querySelector('.task-card[data-run-id="' + ev.run_id + '"]');
  // succeeded 不顯示：已完成即從列表移除該卡（無卡時忽略）。
  if (ev.status && HIDDEN_TASK_STATUSES.has(ev.status)) { if (card) card.remove(); return; }
  if (!card) { fetchTasks(); return; }
  const pct = ev.progress ?? ev.progress_percent ?? 0;
  const fill = card.querySelector('.progress-bar-fill');
  if (fill) fill.style.width = pct + '%';
  const st = card.querySelector('.task-status');
  if (st && ev.status) { st.textContent = ev.status; st.className = 'task-status status-' + ev.status; }
  const meta = card.querySelectorAll('.task-meta span');
  if (meta.length > 0 && ev.stage) meta[0].textContent = ev.stage;
}
async function fetchTasks() {
  try {
    const data = await getJson(API + '/tasks?limit=20');
    renderTaskList(data.tasks);
  } catch (e) { /* 靜默：狀態頁另有系統狀態顯示 */ }
}
// 送出 AI 任務（ai:narrative）：右欄輸入框內容走前端 AI 任務入口 /ai-tasks。
// 註：這是「前端建任務」，不是本機 Patent Companion 的裝置側取任務通道。
async function sendAiRequest() {
  const btn = el('btn-ai-send');
  const input = el('ai-input');
  const text = (input && input.value.trim()) || '';
  if (!getAiToken()) { alert('請先在右欄填入 AI 任務金鑰（PATENT_API_TOKEN）'); return; }
  btn.disabled = true; btn.textContent = '送出中…';
  try {
    const payload = { workspace_id: state.workspaceId, cli_kind: 'claude' };
    if (text) payload.instruction = text;
    if (state.nav) payload.based_on_version = state.nav;
    const resp = await fetch(API + '/ai-tasks', {
      method: 'POST', headers: aiAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(payload),
    });
    if (resp.status === 401) { alert('AI 任務金鑰不正確，請重新填寫'); return; }
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('建立 AI 任務失敗：' + (err.detail || resp.status));
      return;
    }
    const created = await resp.json();
    if (input) input.value = '';
    await fetchTasks();
    // 建立後持續輪詢該 AI 任務，完成即把產出 render 到 AI 產出區（不再取回即丟棄）。
    pollAiTask(created.run_id);
  } catch (e) {
    alert('連線錯誤：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '送出給 AI 助手';
  }
}
// 輪詢 AI 任務（GET /ai-tasks/{run_id}，需 bearer）：succeeded 顯示產出，failed 顯示 error_message。
async function pollAiTask(runId) {
  const wrap = el('ai-task-result');
  if (!wrap) return;
  wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">AI 任務 #' + escHtml(runId) + ' 執行中…</div>';
  async function tick() {
    try {
      const t = await getJson(API + '/ai-tasks/' + runId, { headers: aiAuthHeaders() });
      if (t.status === 'succeeded') { renderAiTaskResult(t); return; }
      if (['failed', 'cancelled'].includes(t.status)) { renderAiTaskResult(t); return; }
      wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">AI 任務 #' + escHtml(runId)
        + ' ' + escHtml(t.status) + '　' + escHtml(t.current_stage || '') + '</div>';
    } catch (e) {
      wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">查詢 AI 任務失敗（' + escHtml(e.message) + '）。</div>';
      return;
    }
    setTimeout(tick, 3000);
  }
  tick();
}
// 顯示 AI 產出：result 為 dict（欄名依任務型別而異），逐鍵列出文字內容；過長由 CSS 捲動。
// 失敗時顯示 error_message（沿用既有欄名）。
function renderAiTaskResult(t) {
  const wrap = el('ai-task-result');
  if (!wrap) return;
  if (t.status !== 'succeeded') {
    wrap.innerHTML = '<div class="ai-result-card"><div class="task-detail-title">AI 任務 #'
      + escHtml(t.run_id) + ' ' + escHtml(t.status) + '</div>'
      + '<div class="ai-result-body task-detail-error">' + escHtml(t.error_message || '（無錯誤訊息）') + '</div></div>';
    return;
  }
  const result = t.result;
  if (!result || Object.keys(result).length === 0) {
    wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">AI 任務 #' + escHtml(t.run_id) + ' 完成，但無產出內容。</div>';
    return;
  }
  // 欄名不寫死：把 result 各鍵當作段落標題逐一顯示，物件型別轉 JSON 呈現。
  const sections = Object.keys(result).map(k =>
    '<details class="ai-result-card" open>'
    + '<summary>' + escHtml(k) + '</summary>'
    + '<div class="ai-result-body">' + escHtml(aiResultText(result[k])) + '</div>'
    + '</details>'
  ).join('');
  wrap.innerHTML = '<div class="task-detail-title">AI 任務 #' + escHtml(t.run_id) + ' 產出</div>' + sections;
}
function aiResultText(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v, null, 2); } catch (_) { return String(v); }
}

// ══════════ SSE 訂閱（斷線退化 30 秒輪詢） ══════════
let sse = null;
let ssePollTimer = null;
function connectSSE() {
  if (sse) sse.close();
  try { sse = new EventSource(API + '/events'); }
  catch (_) { startPollFallback(); return; }
  sse.onmessage = function (e) {
    try {
      const ev = JSON.parse(e.data);
      if (ev.kind === 'run') updateTaskFromEvent(ev);
    } catch (_) {}
  };
  sse.addEventListener('heartbeat', function () {});
  sse.onopen = function () {
    if (ssePollTimer) { clearInterval(ssePollTimer); ssePollTimer = null; }
  };
  sse.onerror = function () {
    if (sse) { sse.close(); sse = null; }
    startPollFallback();
  };
}
function startPollFallback() {
  if (!ssePollTimer) {
    ssePollTimer = setInterval(fetchTasks, 30000);  // 斷線退化：30 秒輪詢保底
  }
}

// ══════════ 匯入專利資料（頂列匯入鈕 → 對話框 → POST /imports → 輪詢 /jobs） ══════════
// workspace 二選一（新建 / 加入既有）互斥，對齊後端 create_import 的 workspace_id 與
// new_workspace_name 互斥參數；用途對齊 IMPORT_PURPOSES（general／case_comparison）。
// 上傳以檔案原始內容作 raw body 送出（沿 imports API 的串流語意，不打包 multipart）。
function openImportDialog() {
  resetImportDialog();
  populateImportWorkspaces();
  const ov = el('import-overlay');
  if (ov) ov.hidden = false;
}
function closeImportDialog() {
  const ov = el('import-overlay');
  if (ov) ov.hidden = true;
  if (importPollTimer) { clearTimeout(importPollTimer); importPollTimer = null; }
}
// 重置對話框：清錯誤、確認摘要、進度、結果與檔案選擇，恢復按鈕與模式。
function resetImportDialog() {
  showImportError('');
  const prog = el('import-progress'); if (prog) prog.innerHTML = '';
  const res = el('import-result'); if (res) res.innerHTML = '';
  const f = el('import-file'); if (f) f.value = '';
  const btn = el('btn-start-import');
  if (btn) { btn.disabled = false; btn.textContent = '開始匯入'; }
  cancelImportConfirm();
  const modeNew = el('import-ws-mode-new'); if (modeNew) modeNew.checked = true;
  onImportWsModeChange();
}
// ── 匯入確認：送出前先組摘要讓使用者核對，按「確認匯入」才真的上傳 ──
// 目標 workspace 顯示「新建名稱」或「既有 workspace 名稱」，皆讀當下真實選擇，不寫死。
function collectImportChoice() {
  const fileInput = el('import-file');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) return { error: '請先選擇要匯入的檔案。' };
  const mode = importWsMode();
  const purposeSel = el('import-purpose');
  const purposeValue = purposeSel ? purposeSel.value : 'general';
  const purposeLabel = (purposeSel && purposeSel.selectedOptions.length)
    ? purposeSel.selectedOptions[0].textContent : purposeValue;
  const choice = { file: file, mode: mode, purposeValue: purposeValue, purposeLabel: purposeLabel };
  if (mode === 'new') {
    const name = (el('import-new-ws-name').value || '').trim();
    if (!name) return { error: '請輸入新 workspace 名稱。' };
    choice.newWorkspaceName = name;
    choice.workspaceLabel = '新建「' + name + '」';
  } else {
    const sel = el('import-existing-ws');
    const wsId = sel ? sel.value : '';
    if (!wsId) return { error: '請選擇要加入的既有 workspace。' };
    choice.workspaceId = wsId;
    choice.workspaceLabel = '既有「'
      + ((sel.selectedOptions.length ? sel.selectedOptions[0].textContent : wsId)) + '」';
  }
  return { choice: choice };
}
// 檔案大小顯示：以 KB／MB 呈現，避免直接甩位元組數。
function fmtFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}
function buildImportConfirm(choice) {
  return '<div class="import-confirm">'
    + '<div style="font-weight:600">請確認匯入內容</div>'
    + '<div class="stat-grid">'
    + '<span class="k">檔名</span><span>' + escHtml(choice.file.name) + '</span>'
    + '<span class="k">大小</span><span>' + escHtml(fmtFileSize(choice.file.size)) + '</span>'
    + '<span class="k">目標 workspace</span><span>' + escHtml(choice.workspaceLabel) + '</span>'
    + '<span class="k">用途</span><span>' + escHtml(choice.purposeLabel) + '</span>'
    + '</div></div>';
}
// 待確認的匯入選擇（按「確認匯入」時使用，避免重複讀取表單）
let pendingImportChoice = null;
// 「開始匯入」→ 驗證選擇並顯示確認摘要，切換為「確認匯入／返回修改」按鈕。
function reviewImport() {
  showImportError('');
  const res = el('import-result'); if (res) res.innerHTML = '';
  const outcome = collectImportChoice();
  if (outcome.error) { showImportError(outcome.error); return; }
  pendingImportChoice = outcome.choice;
  const box = el('import-confirm');
  if (box) box.innerHTML = buildImportConfirm(outcome.choice);
  toggleImportConfirmButtons(true);
}
// 「返回修改」→ 收掉摘要，回到可改表單的狀態。
function cancelImportConfirm() {
  pendingImportChoice = null;
  const box = el('import-confirm'); if (box) box.innerHTML = '';
  toggleImportConfirmButtons(false);
}
function toggleImportConfirmButtons(confirming) {
  const start = el('btn-start-import');
  const confirm = el('btn-confirm-import');
  const back = el('btn-back-import');
  if (start) start.hidden = confirming;
  if (confirm) { confirm.hidden = !confirming; confirm.disabled = false; confirm.textContent = '確認匯入'; }
  if (back) back.hidden = !confirming;
}
// 二選一互斥：new 模式啟用名稱輸入、停用既有下拉；existing 模式反之。
function onImportWsModeChange() {
  const mode = importWsMode();
  const nameInput = el('import-new-ws-name');
  const existingSel = el('import-existing-ws');
  if (nameInput) nameInput.disabled = (mode !== 'new');
  if (existingSel) existingSel.disabled = (mode !== 'existing');
}
function importWsMode() {
  const existing = el('import-ws-mode-existing');
  return (existing && existing.checked) ? 'existing' : 'new';
}
// 既有 workspace 下拉接真實 /workspaces（不寫死）；沿用清單 API 的 items 欄位。
async function populateImportWorkspaces() {
  const sel = el('import-existing-ws');
  if (!sel) return;
  try {
    const data = await getJson(API + '/workspaces?limit=200');
    const items = data.items || [];
    if (items.length === 0) {
      sel.innerHTML = '<option value="">（尚無既有 workspace）</option>';
      return;
    }
    sel.innerHTML = items.map(w =>
      '<option value="' + w.workspace_id + '">'
      + escHtml(w.workspace_name) + '（' + (w.patent_count ?? 0) + ' 件）</option>'
    ).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">載入失敗</option>';
  }
}
function showImportError(msg) {
  const box = el('import-error');
  if (!box) return;
  if (!msg) { box.hidden = true; box.textContent = ''; return; }
  box.hidden = false; box.textContent = msg;
}
// 確認匯入：以已確認的選擇組 query（filename/purpose + workspace 二選一其一）
// → 以檔案 raw body POST /imports → 拿 job_id 輪詢 /jobs。422/413 顯示可讀中文，不吞錯。
async function startImport() {
  showImportError('');
  const res = el('import-result'); if (res) res.innerHTML = '';
  // 未經確認直接呼叫時（例如程式流程改動），退回確認步驟而非直接上傳。
  if (!pendingImportChoice) { reviewImport(); return; }
  const choice = pendingImportChoice;
  const file = choice.file;

  // 組 query：filename／purpose 固定，workspace 二選一其一（new_workspace_name 或 workspace_id）。
  const qsParts = [
    'filename=' + encodeURIComponent(file.name),
    'purpose=' + encodeURIComponent(choice.purposeValue),
  ];
  if (choice.mode === 'new') {
    qsParts.push('new_workspace_name=' + encodeURIComponent(choice.newWorkspaceName));
  } else {
    qsParts.push('workspace_id=' + encodeURIComponent(choice.workspaceId));
  }
  const queryString = qsParts.join('&');

  const btn = el('btn-confirm-import');
  if (btn) { btn.disabled = true; btn.textContent = '上傳中…'; }
  try {
    // body 直送檔案本體（raw body 串流）；Content-Type 隨檔（瀏覽器以 File 型別帶出）。
    const resp = await fetch(API + '/imports?' + queryString, {
      method: 'POST',
      headers: file.type ? { 'Content-Type': file.type } : {},
      body: file,
    });
    if (!resp.ok) {
      showImportError(importErrorMessage(resp.status, await resp.json().catch(() => ({}))));
      if (btn) { btn.disabled = false; btn.textContent = '確認匯入'; }
      return;
    }
    const job = await resp.json();
    pollImportJob(job.job_id);
  } catch (e) {
    showImportError('連線錯誤：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '確認匯入'; }
  }
}
// 錯誤碼轉可讀中文：422（副檔名／workspace 二選一互斥／空檔）、413（過大），其餘照原訊息。
function importErrorMessage(status, err) {
  const detail = (err && err.detail) ? (typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail)) : '';
  if (status === 422) return '無法匯入（422）：' + (detail || '檔案格式或 workspace 選擇不符（副檔名須為 .xlsx/.csv/.txt/.xml，且 workspace 僅能擇一）。');
  if (status === 413) return '檔案過大（413）：' + (detail || '超過上傳容量上限。');
  return '匯入失敗（' + status + '）：' + (detail || '請稍後再試。');
}
// 輪詢匯入 job（GET /jobs/{id}）：以統一進度元件呈現進度／階段／已耗時；完成顯示匯入統計並刷新 workspace 下拉。
let importPollTimer = null;
async function pollImportJob(jobId) {
  const prog = el('import-progress');
  const started = Date.now();
  async function tick() {
    const ov = el('import-overlay');
    if (!prog || (ov && ov.hidden)) return;  // 對話框已關閉即停止輪詢
    try {
      const j = await getJson(API + '/jobs/' + jobId);
      prog.innerHTML = jobProgressCardHtml(j, started);
      if (j.status === 'succeeded') {
        // 先記下這批匯入落在哪個 workspace（result 帶 workspace_id），供結果卡快捷使用。
        renderImportResult(j);
        // 匯入完成刷新頂列 workspace 下拉（新建的要出現、圈進的可選）。
        await loadWorkspaces();
        cancelImportConfirm();
        const btn = el('btn-start-import');
        if (btn) { btn.disabled = false; btn.textContent = '再次匯入'; }
        return;
      }
      if (['failed', 'cancelled'].includes(j.status)) {
        showImportError('匯入工作失敗：' + (j.error_message || '（無錯誤訊息）'));
        const btn = el('btn-confirm-import');
        if (btn) { btn.disabled = false; btn.textContent = '確認匯入'; }
        return;
      }
    } catch (e) {
      showImportError('查詢匯入狀態失敗：' + e.message);
      return;
    }
    importPollTimer = setTimeout(tick, 2000);
  }
  tick();
}
// 完成結果：讀 job.result 的匯入統計欄（inserted/matched_existing/updated/patent_ids），欄名以
// wips_importer summary 為準（另含 status/skipped）。patent_ids 顯示件數。
// 目標 workspace 讀 result.workspace_id／result.workspace（worker 併入 summary），並提供
// 「前往該 workspace 專利總覽」快捷（切 workspace + 導覽到 patents）。
function renderImportResult(j) {
  const wrap = el('import-result');
  if (!wrap) return;
  const r = j.result || {};
  const patentCount = Array.isArray(r.patent_ids) ? r.patent_ids.length : (r.patent_ids ?? 0);
  const ws = r.workspace || {};
  const wsId = r.workspace_id ?? ws.workspace_id ?? null;
  const wsName = ws.workspace_name || (wsId !== null ? ('#' + wsId) : '（未指定）');
  const shortcut = wsId !== null
    ? '<div style="margin-top:0.7rem"><button class="btn btn-primary" id="btn-goto-imported-ws"'
      + ' onclick="gotoImportedWorkspace(' + wsId + ')">前往該 workspace 專利總覽</button></div>'
    : '';
  wrap.innerHTML = '<div class="card import-result">'
    + '<div style="font-weight:600;color:var(--ok)">✓ 匯入完成</div>'
    + '<div class="stat-grid">'
    + '<span class="k">新增（inserted）</span><span>' + (r.inserted ?? 0) + '</span>'
    + '<span class="k">命中既有（matched_existing）</span><span>' + (r.matched_existing ?? 0) + '</span>'
    + '<span class="k">更新（updated）</span><span>' + (r.updated ?? 0) + '</span>'
    + '<span class="k">本批專利數（patent_ids）</span><span>' + patentCount + '</span>'
    + '</div>'
    + '<div style="margin-top:0.5rem">已加入 workspace <strong>' + escHtml(wsName) + '</strong>。</div>'
    + shortcut
    + '</div>';
}
// 快捷：關閉對話框 → 切到該 workspace → 導覽到專利總覽。
function gotoImportedWorkspace(workspaceId) {
  closeImportDialog();
  const sel = el('workspace-select');
  if (sel) sel.value = String(workspaceId);
  state.workspaceId = workspaceId;
  state.patentsOffset = 0;
  state.topicFilterKey = null;
  navTo('patents');
}

// ══════════ 初始化 ══════════
loadWorkspaces();
fetchTasks();
connectSSE();
setInterval(fetchTasks, 60000);  // 保底整體重整
</script>
</body>
</html>
