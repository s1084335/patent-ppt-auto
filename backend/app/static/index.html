<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專利分析平台</title>
<style>
/* ── 主題變數：亮暗雙主題（data-theme 覆寫） ── */
:root {
  --bg: #f0f2f5; --panel: #ffffff; --panel-2: #f7f9fc; --border: #e2e6ec;
  --text: #1a1a2e; --text-muted: #6c757d; --accent: #0f3460; --accent-2: #1a6bc4;
  --nav-active-bg: #0f3460; --nav-active-fg: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --ok: #1a8a4a; --warn: #d0384e;
  /* 詳情層（比照專利公報書目資料）：標籤欄底色與節標題底色。 */
  --detail-label-bg: #fdf4fb; --detail-label-fg: #8e3b76; --detail-section-bg: #fdf6e3;
}
:root[data-theme="dark"] {
  --bg: #12141c; --panel: #1c1f2b; --panel-2: #232634; --border: #2f3342;
  --text: #e6e8ef; --text-muted: #9aa2b4; --accent: #4d8fdb; --accent-2: #6fa8e8;
  --nav-active-bg: #2a4a7a; --nav-active-fg: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.4);
  --ok: #4ecb7d; --warn: #f0748a;
  --detail-label-bg: #2a2333; --detail-label-fg: #d9a8cd; --detail-section-bg: #2e2a1f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141c; --panel: #1c1f2b; --panel-2: #232634; --border: #2f3342;
    --text: #e6e8ef; --text-muted: #9aa2b4; --accent: #4d8fdb; --accent-2: #6fa8e8;
    --nav-active-bg: #2a4a7a; --nav-active-fg: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.4);
    --ok: #4ecb7d; --warn: #f0748a;
    --detail-label-bg: #2a2333; --detail-label-fg: #d9a8cd; --detail-section-bg: #2e2a1f;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, 'Microsoft JhengHei', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
button { font-family: inherit; }

/* ── 頂列 ── */
#topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 1rem;
  padding: 0.6rem 1.1rem; background: var(--panel); border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow); z-index: 5;
}
#topbar .brand { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
#topbar .spacer { flex: 1; }
#workspace-select {
  padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 0.35rem;
  background: var(--panel-2); color: var(--text); font-size: 0.9rem; min-width: 220px;
}
.icon-btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  border-radius: 0.35rem; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.85rem;
}
.icon-btn:hover { border-color: var(--accent); }

/* ── 三欄主體 ── */
#layout { flex: 1 1 auto; display: flex; min-height: 0; }
#nav-panel {
  flex: 0 0 200px; background: var(--panel); border-right: 1px solid var(--border);
  padding: 0.75rem 0.5rem; overflow-y: auto;
}
#main-panel {
  flex: 1 1 auto; padding: 1.1rem 1.35rem; overflow-y: auto; min-width: 0;
}
#ai-panel {
  /* 2026-07-24 定案：AI 助手欄縮窄（原 300px），讓中間專利顯示更寬更清楚。 */
  flex: 0 0 240px; background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── 左導覽 ── */
.nav-item {
  display: block; width: 100%; text-align: left; border: none; background: transparent;
  color: var(--text); padding: 0.55rem 0.7rem; border-radius: 0.4rem; cursor: pointer;
  font-size: 0.92rem; margin-bottom: 0.15rem;
}
.nav-item:hover { background: var(--panel-2); }
.nav-item.active { background: var(--nav-active-bg); color: var(--nav-active-fg); font-weight: 600; }
.nav-section-label { font-size: 0.72rem; color: var(--text-muted); padding: 0.4rem 0.7rem 0.2rem; text-transform: uppercase; letter-spacing: .04em; }
/* ── 專利列表：點列展開詳情 ── */
.patent-row-clickable { cursor: pointer; }
.patent-row-clickable:hover { background: var(--panel-2); }
/* 詳情層版面（2026-07-26 定案，比照專利公報「書目資料」樣式）：
   標籤欄固定窄寬＋底色、值欄佔滿其餘寬度，逐列單欄排列（不再多欄流式 grid）。
   單欄的理由：值長度差異極大（摘要數百字 vs 申請日 8 字），多欄會讓長值擠在窄格
   而短值留大片空白；逐列排列讓每個值都能用滿版寬度，長文也不必換窄行。 */
.patent-detail { display: block; padding: 0.6rem 0.4rem; }
.patent-detail-section { font-size: 0.9rem; font-weight: 600; color: var(--text);
  background: var(--detail-section-bg); border: 1px solid var(--border);
  border-radius: 0.3rem; padding: 0.4rem 0.7rem; margin: 0.7rem 0 0.4rem; }
.patent-detail-section:first-child { margin-top: 0; }
.patent-detail-item { display: flex; align-items: stretch; font-size: 0.86rem;
  border-bottom: 1px dotted var(--border); }
.patent-detail-item:last-child { border-bottom: none; }
/* 標籤欄：固定寬、底色、右對齊——與參考公報版面一致，掃描時容易對齊找欄位。 */
/* 標籤欄再窄（9.5→8rem）、標籤文字置中（2026-07-26 使用者定案：粉紅標籤欄置中）；
   值欄維持靠左（長文靠左讀比較順）。 */
.patent-detail-item dt { flex: 0 0 8rem; color: var(--detail-label-fg);
  background: var(--detail-label-bg); padding: 0.42rem 0.5rem; text-align: center;
  border-right: 1px solid var(--border); }
.patent-detail-item dd { flex: 1 1 auto; margin: 0; padding: 0.42rem 0.75rem;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; min-width: 0; }
/* 詳情層固定在可視寬度內（2026-07-26）：詳情 td 在超寬 table 內，若不 sticky+限寬，
   內容會跟著 table 總寬跑到右邊、越過 AI 助手被切掉。sticky left:0 黏在可視區左緣；
   寬度＝視窗寬扣掉左導覽(#nav-panel 200px)＋右 AI 助手(#ai-panel 240px)＋main-panel 左右
   padding(約 2.7rem)，讓詳情剛好落在 AI 助手前面、長文在此範圍內換行到完整顯示，不越界。 */
/* 詳情層寬度對齊第一層表格可視區（2026-07-26 使用者定案）：sticky left:0 黏在可視左緣，
   寬度用視窗寬扣掉左導覽(200px)＋右 AI 助手(240px)＋padding，落在申請人(原文)那一帶、
   不越過 AI 助手；長文在此範圍內換行到完整。 */
/* 詳情層寬度（2026-07-27 修）：改用 sticky 黏可視左緣＋容器寬 100%，
   不再用 100vw 硬扣導覽與 AI 助手的像素寬——那組數字在 AI 助手收合或視窗縮放時
   就不成立，算出的寬度溢出成橫向捲軸。100% 取自 .table-wrap 的實際可視寬，
   自動跟著容器走。 */
.patent-detail-row > td { background: var(--panel); padding: 0;
  position: sticky; left: 0;
  width: 100%; max-width: 100%; box-sizing: border-box; overflow: hidden; }
.patent-detail { box-sizing: border-box; max-width: 100%; }
/* 詳情層整層左右兩欄（2026-07-27 使用者定）：左＝所有文字節（摘要、書目資料…），
   右＝主附圖。原本只有書目資料節分兩欄、摘要節滿寬，上下邊界不齊。
   min-width:0 是關鍵——flex 項目預設 min-width:auto 會被內容撐大而溢出容器，
   設 0 才會真正收縮並讓長文換行（而不是把整層推寬出現橫向捲軸）。 */
.patent-detail-split { display: flex; gap: 0.9rem; align-items: flex-start;
  flex-wrap: wrap; padding: 0.7rem 0.9rem; box-sizing: border-box; max-width: 100%; }
/* 兩欄相加必須是 100%（扣掉 gap）——2026-07-27 使用者：「圖的右邊邊界對齊文獻備註
   右邊邊界」。原本 58%+34%=92%，右側空 8% 讓圖看起來偏左、右邊界對不齊表格。
   改用 flex-basis: 0 ＋ grow 比例（3:2），由 flex 自行分配扣掉 gap 後的全寬，
   不必手算百分比；min-width:0 仍是防溢出的關鍵。 */
.patent-detail-main { flex: 3 1 0; min-width: 0; }
.patent-detail-figure { flex: 2 1 0; min-width: 12rem; text-align: center;
  padding: 0.6rem; border: 1px solid var(--border); border-radius: 0.4rem;
  background: var(--panel-2);
  display: flex; align-items: flex-start; justify-content: center;
  box-sizing: border-box; }
.patent-detail-figure img { max-width: 100%; max-height: 24rem; height: auto;
  background: #fff; border-radius: 0.3rem; }

/* 頂列版的 nav-item（專利總覽）：沿用 .nav-item 的 active 樣式，但改為行內寬度。 */
.topbar-nav { display: inline-block; width: auto; margin-bottom: 0; white-space: nowrap; }
.topbar-divider { width: 1px; height: 1.4rem; background: var(--border); }

/* ── 主內容通用 ── */
.panel-title { font-size: 1.25rem; margin-bottom: 0.9rem; color: var(--text); }
.hint { color: var(--text-muted); font-size: 0.9rem; padding: 1.2rem 0; }
.card {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 0.5rem;
  padding: 1rem 1.15rem; margin-bottom: 1rem;
}
.toolbar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.9rem; }
.text-input {
  padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 0.35rem;
  background: var(--panel); color: var(--text); font-size: 0.9rem;
}
.btn {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.95rem;
  border: none; border-radius: 0.35rem; font-size: 0.88rem; cursor: pointer; transition: opacity .15s;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { opacity: .88; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

/* ── 表格 ── */
/* 專利顯示（27 欄）在自身容器內橫向捲動；max-width 上限＝父容器寬，避免撐爆版面、
   page body 不橫向捲動（2026-07-24 定案：專利顯示加捲軸）。縱向依內容，不強制。 */
/* 表格容器：橫向捲軸黏在「當前可視畫面底緣」，不固定在整個表格最底部。
   做法：table-wrap 同時可橫捲＋直捲，並把最大高度限成可視區高度——如此水平捲軸
   永遠出現在可視區底部，垂直捲到哪都能就近左右捲，不必拉到表尾。頂部不另加捲軸。 */
.table-wrap { max-width: 100%; border: 1px solid var(--border); border-radius: 0.5rem;
  overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 15rem); }
table.data { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
/* 所有欄位預設可換行、不截斷（2026-07-26 使用者定案：一行放不完就換行，任何欄都不被切）。
   word-break/overflow-wrap 讓長英文串也能斷行；限最大寬避免單欄過寬撐爆表格。
   極短欄（國別／年份／日期）另以 .cell-nowrap 維持不換行（本來就短，不需換行）。
   加直向框線（border-right）讓每欄邊界清楚，值不混到隔壁欄。 */
table.data th, table.data td { padding: 0.5rem 0.7rem; text-align: left;
  border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
  white-space: normal; word-break: break-word; overflow-wrap: anywhere;
  vertical-align: top; min-width: 6rem; max-width: 20rem; }
table.data th:last-child, table.data td:last-child { border-right: none; }
table.data th.cell-nowrap, table.data td.cell-nowrap {
  white-space: nowrap; min-width: 0; max-width: none; }
table.data th { background: var(--panel-2); position: sticky; top: 0; font-weight: 600; }
table.data tr:hover td { background: var(--panel-2); }
/* 欄寬分三級（2026-07-27 加 .cell-xlong：摘要類整段文字在 26rem 下會斷成七八行）：
   .cell-xlong＝整段敘述（摘要／摘要(原文)／文獻備註）→ 最寬，讓一句話不必斷太多行。
   .cell-long＝一般長文（標題／專利狀態長句）→ 較寬，容納多字換行。
   .cell-wrap＝一般會換行但內容通常較短的欄（原文欄／公司名等）→ 較窄，不浪費版面。
   三者都 white-space:normal 換行、限寬不溢到隔壁欄；差別只在寬度級距。 */
table.data td.cell-xlong, table.data th.cell-xlong {
  white-space: normal; word-break: break-word; overflow-wrap: anywhere;
  min-width: 28rem; max-width: 44rem; }
table.data td.cell-long, table.data th.cell-long {
  white-space: normal; word-break: break-word; overflow-wrap: anywhere;
  min-width: 16rem; max-width: 26rem; }
table.data td.cell-wrap, table.data th.cell-wrap {
  white-space: normal; word-break: break-word; overflow-wrap: anywhere;
  min-width: 8rem; max-width: 14rem; }
/* AI 命名手動觸發區（2026-07-27）：置於進階操作最上方，與其他人工操作分隔。 */
.topic-ai-label-box { padding: 0 0 .6rem; border-bottom: 1px solid var(--border); margin-bottom: .6rem; }
.topic-ops-title { font-weight: 600; margin-bottom: .35rem; }
/* 主題摘要卡（2026-07-27）：平時收合只見標題與件數，點開才顯示 AI 摘要。 */
.topic-summary-card > summary { cursor: pointer; list-style: none; }
.topic-summary-card > summary::-webkit-details-marker { display: none; }
.topic-summary-card > summary::before { content: '▸'; margin-right: .4rem; color: var(--text-muted); }
.topic-summary-card[open] > summary::before { content: '▾'; }
.topic-summary-hint { margin-left: .5rem; font-size: .8rem; color: var(--text-muted); }
.topic-summary-text { margin-top: .5rem; line-height: 1.7; }
.topic-summary-empty { margin-top: .5rem; color: var(--text-muted); font-size: .88rem; }
.flag-yes { color: var(--ok); } .flag-no { color: var(--text-muted); }
.pager { display: flex; align-items: center; gap: 0.7rem; margin-top: 0.8rem; font-size: 0.88rem; color: var(--text-muted); }

/* ── 分類區分頁（技術／功效兩通道） ── */
.tab-bar { display: flex; gap: 0.3rem; border-bottom: 2px solid var(--border); margin-bottom: 0.9rem; }
/* 分類區標題列（2026-07-27 使用者定）：分類區｜技術／功效｜分類｜重新挑選分類 同一列橫排。
   原本五個元素各佔一行，垂直吃掉太多高度、把主題標籤與專利清單推到很下面。
   flex-wrap 讓窄螢幕自動折行，不擠壓也不溢出。 */
.topics-header {
  display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
  margin-bottom: .7rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border);
}
/* tabs 併進標題列後不需要自己的底線與下方留白（外層已有） */
.topics-header .tab-bar { border-bottom: none; margin-bottom: 0; }
.topics-header .topic-tab { padding: 0.35rem 0.85rem; }
.topics-header-hint { padding: 0; font-size: .82rem; }
.topic-tab {
  border: none; background: transparent; color: var(--text-muted); cursor: pointer;
  padding: 0.5rem 1.1rem; font-size: 0.95rem; border-bottom: 2px solid transparent;
  margin-bottom: -2px; border-radius: 0.35rem 0.35rem 0 0;
}
.topic-tab:hover { background: var(--panel-2); color: var(--text); }
.topic-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
/* 主題進階操作：收在專利清單之後的可展開區塊，不擋住標籤與專利 */
.topic-advanced { margin-top: 1.2rem; border-top: 1px solid var(--border); padding-top: 0.6rem; }
.topic-advanced > summary { cursor: pointer; font-size: 0.9rem; color: var(--text-muted); padding: 0.35rem 0; }
.topic-advanced > summary:hover { color: var(--accent); }
/* 分群候選挑選卡（尚未採用分類時顯示；每組候選一張卡，可點選） */
.cand-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.6rem; margin: 0.7rem 0; }
.cand-card {
  border: 1px solid var(--border); border-radius: 0.45rem; padding: 0.7rem 0.85rem;
  background: var(--panel-2); cursor: pointer;
}
.cand-card:hover { border-color: var(--accent); }
.cand-card.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cand-card-title { font-weight: 600; margin-bottom: 0.35rem; display: flex; justify-content: space-between; gap: 0.5rem; }
.cand-metrics { font-size: 0.8rem; color: var(--text-muted); display: grid; gap: 0.15rem; }
.cand-metrics .m-name { display: inline-block; min-width: 6.5rem; }
.cand-explain { margin-top: 0.4rem; font-size: 0.78rem; color: var(--text-muted); white-space: pre-wrap; }
/* 總覽的所屬 workspace 標記（一筆專利可屬多個） */
.ws-chip {
  display: inline-block; padding: 0.1rem 0.5rem; margin: 0.1rem 0.15rem 0.1rem 0;
  border: 1px solid var(--border); border-radius: 0.9rem; background: var(--panel-2);
  font-size: 0.78rem; white-space: nowrap;
}

/* ── 專利主附圖（總覽清單縮圖；來源長邊約 460px，此處縮到 72px 供快速掃視） ── */
.patent-figure {
  display: block; width: 72px; height: 72px; object-fit: contain;
  border: 1px solid var(--border); border-radius: 0.25rem; background: #fff;
}
.figure-empty { color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }

/* ── 標籤（分類區） ── */
.tag-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.tag {
  padding: 0.35rem 0.7rem; border: 1px solid var(--border); border-radius: 1rem;
  background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 0.85rem;
}
.tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag .count { opacity: .7; margin-left: 0.3rem; }

/* ── 報表勾選 ── */
.report-check-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
.report-check {
  display: flex; align-items: center; gap: 0.55rem; padding: 0.55rem 0.7rem;
  border: 1px solid var(--border); border-radius: 0.4rem; background: var(--panel-2); font-size: 0.88rem;
}
.report-check input { width: 1rem; height: 1rem; }

/* ── 專利權人代碼補齊（2026-07-28）── */
.code-group { border: 1px solid var(--border); border-radius: 0.45rem; padding: 0.7rem 0.85rem;
  margin-bottom: 0.7rem; background: var(--panel-2); }
.code-group-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
.code-group-head .idx { font-weight: 600; font-size: 0.9rem; }
.code-field { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.code-field > label { flex: 0 0 6.2rem; font-size: 0.85rem; color: var(--text-muted); }
.code-field input { flex: 1 1 auto; min-width: 0; }
.code-variant-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.32rem; }
.code-variant-row input { flex: 1 1 auto; min-width: 0; }
.btn-mini { padding: 0.18rem 0.55rem; font-size: 0.85rem; line-height: 1.3;
  border: 1px solid var(--border); border-radius: 0.3rem; background: var(--panel);

</head>
<body>

<!-- ══ 頂列：workspace 切換（全庫＝下拉第一項） ══ -->
<!-- 2026-07-24 定案（推翻 07-23）：專利總覽併進 Workspace 下拉，全庫為第一項，
     選它＝原總覽視角；頂列獨立藍鈕收掉。全庫恆為可選第一項，不再有空狀態。 -->
<header id="topbar">
  <span class="brand">專利分析平台</span>
  <label for="workspace-select" style="font-size:0.82rem;color:var(--text-muted)">Workspace</label>
  <select id="workspace-select" onchange="onWorkspaceChange()">
    <option value="">載入中…</option>
  </select>
  <button class="icon-btn" id="btn-open-import" onclick="openImportDialog()" title="匯入專利資料檔">⬆ 匯入資料</button>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="切換亮／暗主題">🌗 主題</button>
</header>

<div id="layout">
  <!-- ══ 左欄：導覽 ══ -->
  <!-- 左導覽只留「workspace 內」功能；跨 workspace 的專利總覽在頂列（2026-07-24 定案）。 -->
  <nav id="nav-panel">
    <div class="nav-section-label">分析</div>
    <button class="nav-item" data-nav="browse" onclick="navTo('browse')">瀏覽專利</button>
    <button class="nav-item" data-nav="topics" onclick="navTo('topics')">分類區</button>
    <div class="nav-section-label">報告</div>
    <button class="nav-item" data-nav="reports" onclick="navTo('reports')">報表種類</button>
    <button class="nav-item" data-nav="export" onclick="navTo('export')">匯出報告</button>
    <div class="nav-section-label">進階</div>
    <!-- 🔴 2026-08-03 使用者：「案件比對區塊先移除掉」——只收**入口**。
         renderComparison()、navTo 的 comparison 分支、後端 /api/comparison
         與所有表單 DOM 全部保留（測試 test_comparison_has_create_form 守著）。
         恢復方式：在此加回一個 nav-item 按鈕，data-nav 與 onclick 皆指向 comparison。
         ⚠ 不要連實作一起刪——「先移除」的『先』就是指之後還要用。 -->
    <button class="nav-item" data-nav="status" onclick="navTo('status')">系統狀態</button>
  </nav>

  <!-- ══ 中欄：主內容（依左導覽切換） ══ -->
  <main id="main-panel">
    <div class="hint">正在載入 workspace…</div>
  </main>

  <!-- ══ 右欄：AI 助手 ══ -->
  <aside id="ai-panel">
    <div class="ai-header">AI 助手</div>
    <div class="ai-body" id="ai-body">
      <div class="ai-section-label">任務進度</div>
      <!-- 匯入進度：送出後對話框關閉，進度移到此處顯示（2026-07-26），與下方 AI 任務清單並存互不干擾。 -->
      <div id="import-progress-panel"></div>
      <div id="task-container">
        <div class="task-empty">正在載入任務清單…</div>
      </div>
      <!-- AI 任務完成後的產出（解讀／摘要文字）顯示區；過長可捲動 -->
      <div class="ai-section-label">AI 產出</div>
      <div id="ai-task-result"></div>
    </div>
    <!-- 金鑰輸入已移除（2026-07-26 定案）：AI 任務端點改為 opt-in 認證。 -->
    <!-- ⚠ 解讀需求輸入框已移除（2026-07-29 使用者定案）：AI 助手欄只留任務進度。
         需求輸入移到各報表旁的「重產解讀」——在哪張報表提的需求就只重產那張，
         比在側欄打一段然後整份重跑精準。 -->
  </aside>
</div>

<!-- ══ 匯入對話框：選檔 + workspace 二選一 + 用途 + 進度/結果 ══ -->
<div class="modal-overlay" id="import-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title">
    <div class="modal-head">
      <span class="title" id="import-title">匯入專利資料</span>
      <button class="icon-btn" onclick="closeImportDialog()" title="關閉">✕</button>
    </div>
    <div class="modal-body">
      <!-- 選檔：accept 對齊後端白名單副檔名 -->
      <div class="form-row">
        <label class="form-label" for="import-file">選擇檔案（.xlsx / .csv / .txt / .xml）</label>
        <input type="file" id="import-file" class="full" accept=".xlsx,.csv,.txt,.xml">
      </div>

      <!-- workspace 二選一：新建 or 加入既有（互斥，radio 切換） -->
      <div class="form-row">
        <label class="form-label">匯入到 Workspace</label>
        <div class="radio-line">
          <input type="radio" name="import-ws-mode" id="import-ws-mode-new" value="new" checked onchange="onImportWsModeChange()">
          <label for="import-ws-mode-new">新建 workspace</label>
        </div>
        <input type="text" id="import-new-ws-name" class="text-input full" placeholder="新 workspace 名稱" style="margin-bottom:0.5rem">
        <div class="radio-line">
          <input type="radio" name="import-ws-mode" id="import-ws-mode-existing" value="existing" onchange="onImportWsModeChange()">
          <label for="import-ws-mode-existing">加入既有 workspace</label>
        </div>
        <select id="import-existing-ws" class="text-input full" disabled>
          <option value="">載入中…</option>
        </select>
      </div>

      <!-- 用途：general / case_comparison（預設 general），對齊後端 IMPORT_PURPOSES -->
      <div class="form-row">
        <label class="form-label" for="import-purpose">用途</label>
        <select id="import-purpose" class="text-input full">
          <option value="general" selected>一般情報分析（general）</option>
          <!-- 🔴 2026-08-03 隨案件比對入口一併收起——選了也沒地方可以比對。
               ⚠ 後端 IMPORT_PURPOSES 仍接受 case_comparison，既有資料的標記不受影響；
               恢復時在此加回一個 value="case_comparison" 的 option 即可。 -->
        </select>
      </div>

      <div class="import-error" id="import-error" hidden></div>
      <!-- 選檔後即可送出，不做二次確認：匯入為非破壞性（差異即更新、新值空不覆蓋）。
           進度與結果不再顯示於對話框內——送出即關閉對話框，改在右欄 AI 助手區
           #import-progress-panel 顯示（2026-07-26），使用者關對話框後仍看得到進度。 -->
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeImportDialog()">取消</button>
      <button class="btn btn-primary" id="btn-start-import" onclick="startImport()">開始匯入</button>
    </div>
  </div>
</div>

<script>
"use strict";
const API = '/api/v1';
// 分群通道白名單（對齊後端 backend/app/clustering/sources.py 的 SOURCE_SPECS）。
// 後端目前未提供列舉通道的端點，故在前端集中成單一常數；分類區的技術／功效兩個分頁
// 一律由這份常數產生，不在各處散寫字面值；後端新增通道時只需改這一處。
const SOURCE_FIELDS = [
  ['wips_independent_claims', '技術'],
  ['effect_summary', '功效'],
];
// 分類區預設通道（topics API 需 source_field）；取白名單第一項（技術）。
const DEFAULT_TOPIC_SOURCE_FIELD = SOURCE_FIELDS[0][0];
const PATENTS_PAGE_SIZE = 100;

// ── 全域狀態 ──
const state = {
  workspaceId: null,
  // 全庫（下拉第一項）：選它時 isGlobalWs=true、workspaceId 落到全庫真實 id。
  isGlobalWs: false,
  globalWorkspaceId: null,   // 後端全庫 workspace 真實 id（loadWorkspaces 取得）
  nav: 'patents',
  patentsOffset: 0,
  // 分類區專利清單的分頁位移（2026-07-27 使用者定：與總覽一致都要分頁）。
  // 切換主題／通道／workspace 時歸零，否則會停在上一個主題的頁碼而顯示空白。
  topicPatentsOffset: 0,
  browseOffset: 0,        // 瀏覽專利（跟隨選定 workspace）的分頁 offset
  // 待補標籤篩選（2026-07-29）：{name, ids}；非 null 時瀏覽專利只顯示這些 patent_id。
  pendingNameFilter: null,
  topicFilterKey: null,   // 分類區選定的 topic_key（前端篩選用）
  // 分類區目前分頁的通道（技術／功效）；由 tab 切換，所有 topic 相關呼叫共用同一值。
  topicSourceField: DEFAULT_TOPIC_SOURCE_FIELD,
  // 分群候選挑選：使用者在候選卡上選定的 candidate_id（尚未送出 finalize 前的暫存）。
  candidatePickId: null,
  // 已有正式主題時，使用者是否手動打開「重新挑選分類」入口（預設關閉，顯示正常分類）。
  candidatePickerOpen: false,
  reportSelection: new Set(),
  comparison: { jobId: null, understandingVersion: null },
};

// ══════════ 工具 ══════════
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// 內嵌 onclick 用的字串字面：**單引號**包裹，並跳脫反斜線與單引號。
// ⚠ 不可改用 JSON.stringify——它產雙引號，而 onclick="..." 也是雙引號，
// 屬性會**提前結束**（2026-07-30 實機：onclick 只剩 'runNarrative('，點了沒反應）。
// 這是靜默失敗：HTML 不報錯、按鈕照畫、指標照樣變手形。
function jsQuote(s) {
  return "'" + String(s === null || s === undefined ? '' : s)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
}
function el(id) { return document.getElementById(id); }
// fetch + JSON；非 2xx 丟帶 status 的 Error，讓呼叫端能分辨 404／其他錯誤並給可讀訊息
// （不吞錯：狀態碼保留在 err.status，訊息保留後端 detail）。
async function getJson(url, opts) {
  const resp = await fetch(url, opts);
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    const err = new Error('HTTP ' + resp.status + (body.detail ? '：' + body.detail : ''));
    err.status = resp.status;
    throw err;
  }
  return resp.json();
}

// ══════════ 全域 timer 註冊表（輪詢生命週期管理） ══════════
// 問題：各輪詢原本各自 setTimeout，只靠「節點還在嗎 / state.nav 是不是這一頁」當守衛。
// 切 workspace 不改 state.nav，重畫又會生出同 id 的節點，於是舊 workspace 的輪詢
// 抓得到節點、繼續打舊 job，成功時還會把新 workspace 的畫面覆寫掉。
// 解法：所有輪詢一律經此註冊表排程，切 workspace／切導覽頁時一次清空。
// 註冊表用 Set 存 timer id，不記函式名——日後新增輪詢只要呼叫 registerTimer 就自動受管。
const activeTimers = new Set();
// 排程一次重試並登記；回傳 timer id。tick 執行時先自我註銷（該次已觸發，無須再清）。
function registerTimer(fn, delayMs) {
  const id = setTimeout(function () {
    activeTimers.delete(id);
    fn();
  }, delayMs);
  activeTimers.add(id);
  return id;
}
// 註銷單一 timer（例如對話框關閉時只停自己那條）。
function clearTimer(id) {
  if (id === null || id === undefined) return;
  clearTimeout(id);
  activeTimers.delete(id);
}
// 一次清空所有輪詢：必須真的 clearTimeout——只靠旗標擋不住已排程好的 tick。
function clearAllTimers() {
  activeTimers.forEach(id => clearTimeout(id));
  activeTimers.clear();
}

// ══════════ AI 任務請求標頭 ══════════
// 2026-07-26 定案：AI 任務端點改為 opt-in 認證——伺服器未設 PATENT_API_TOKEN
// 即不驗證，故前端不再要求使用者填金鑰，也不再存 localStorage。
// 本函式保留為單一注入點：若部署端要重新啟用保護（設了 PATENT_API_TOKEN），
// 只需在此加上 Authorization 標頭，呼叫端（sendAiRequest 等）都不必動。
function aiAuthHeaders(extra) {
  return Object.assign({}, extra || {});
}

// ══════════ 主題切換（亮／暗） ══════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('theme', theme); } catch (_) {}
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (_) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();

// ══════════ Workspace 切換 ══════════
// 全庫哨兵：Workspace 下拉第一項固定為「全庫（所有專利）」，value 為此哨兵字串。
// 選它＝原專利總覽視角（renderPatents 全庫，跨 workspace）。全庫恆為可選第一項，
// 不再有「尚無 workspace」空狀態（2026-07-24 定案，一併解掉 HTTP 500 空狀態）。
const GLOBAL_WS_VALUE = '__global__';
// 目前是否選在全庫：下拉選到哨兵時 state.isGlobalWs 為 true。
// 為讓既有 /workspaces/{id}/... 呼叫無需改動，state.workspaceId 一律存「真實數字 id」
// （全庫時存後端全庫 workspace 的真實 id）；哨兵只用於下拉 value 與此旗標。
function isGlobalSelected() { return !!state.isGlobalWs; }
async function loadWorkspaces() {
  const sel = el('workspace-select');
  // 全庫項恆置頂為第一項，即使後端尚無其他 workspace 也永遠有可選項。
  const globalOpt = '<option value="' + GLOBAL_WS_VALUE + '">全庫（所有專利）</option>';
  try {
    const data = await getJson(API + '/workspaces?limit=200');
    const all = data.items || [];
    // 後端全庫 workspace 的真實 id：全庫在下拉以哨兵呈現，但分類／報表等需要真實 id。
    const globalWs = all.find(w => w.is_global);
    state.globalWorkspaceId = globalWs ? globalWs.workspace_id : null;
    const items = all.filter(w => !w.is_global);  // 全庫另以哨兵置頂，清單不重複列
    sel.innerHTML = globalOpt + items.map(w =>
      '<option value="' + w.workspace_id + '">'
      + escHtml(w.workspace_name) + '（' + (w.patent_count ?? 0) + ' 件'
      + (w.is_composed ? '・組合' : '') + '）</option>'
    ).join('');
  } catch (e) {
    // 連 workspace 清單都載不到時，仍保留全庫可選（全庫走 GET /patents，不依賴清單）。
    sel.innerHTML = globalOpt;
    state.globalWorkspaceId = null;
  }
  // 預設選全庫（第一項）＝進站即專利總覽全庫視角。
  sel.value = GLOBAL_WS_VALUE;
  selectGlobalWorkspace();
  state.nav = 'patents';
  renderMain();
}
// 選全庫：旗標打開、workspaceId 落到全庫真實 id（尚未建立全庫時為 null）。
function selectGlobalWorkspace() {
  state.isGlobalWs = true;
  state.workspaceId = state.globalWorkspaceId;
}
function onWorkspaceChange() {
  // 切 workspace 先停掉所有輪詢：舊 workspace 的 job 不得繼續寫入新 workspace 的畫面。
  clearAllTimers();
  const v = el('workspace-select').value;
  if (v === GLOBAL_WS_VALUE) {
    selectGlobalWorkspace();
    state.nav = 'patents';  // 選全庫＝原總覽視角：導向專利總覽（跨 workspace 全庫清單）。
  } else {
    state.isGlobalWs = false;
    state.workspaceId = v ? parseInt(v, 10) : null;
  }
  state.patentsOffset = 0;
  state.topicPatentsOffset = 0;   // 換 workspace 兩份清單的頁碼都歸零
  state.topicFilterKey = null;
  renderMain();
}

// ══════════ 左導覽切換 ══════════
function navTo(nav) {
  // 切導覽頁先停掉所有輪詢：離開的那頁不需要再更新，重畫也會生新的節點。
  clearAllTimers();
  state.nav = nav;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === nav);
  });
  renderMain();
}

// 主內容路由：依 state.nav 呼叫對應 render。
function renderMain() {
  const m = el('main-panel');
  // 專利總覽跨所有 workspace（不需選定 workspace）；status／comparison 亦不綁 workspace。
  // 其餘區（分類區／報表／匯出）仍依選定的 workspace（含全庫）運作。全庫恆為可選第一項，
  // 不再有「尚無 workspace」空狀態；僅在全庫尚未於後端建立（無任何專利）時，分類／報表等
  // workspace 內功能暫無對象，顯示可讀提示（非 500）。
  const WS_FREE_NAVS = ['patents', 'status', 'comparison'];
  if (!state.workspaceId && WS_FREE_NAVS.indexOf(state.nav) === -1) {
    m.innerHTML = isGlobalSelected()
      ? '<div class="hint">全庫尚未建立（尚無匯入專利）；匯入專利後即可使用分類／報表／匯出。</div>'
      : '<div class="hint">此 workspace 尚無法載入。</div>';
    return;
  }
  switch (state.nav) {
    case 'patents': return renderPatents();
    case 'browse': return renderBrowse();
    case 'topics': return renderTopics();
    case 'reports': return renderReports();
    case 'export': return renderExport();
    case 'comparison': return renderComparison();
    case 'status': return renderStatus();
    default: m.innerHTML = '<div class="hint">未知頁面。</div>';
  }
}

// ══════════ 專利總覽（GET /patents：全庫、跨所有 workspace，一頁 100 筆） ══════════
// 2026-07-23 定案：總覽顯示全庫專利（不分 workspace），每筆標示屬於哪些 workspace；
// 分類區／報表／匯出仍依頂列選定的 workspace 運作，故 workspace 切換保留。
async function renderPatents() {
  const m = el('main-panel');
  m.innerHTML = '<h2 class="panel-title">專利總覽</h2>'
    + '<p class="hint" style="padding:0 0 0.6rem">顯示全庫專利（不分 workspace）；'
    + '「所屬 Workspace」欄標示每筆專利被哪些 workspace 收錄。'
    + '<strong>點任一列可展開該件的完整欄位</strong>。</p>'
    + '<div class="toolbar">'
    + '<input class="text-input" id="patent-kw" placeholder="搜尋 專利號／名稱／申請人" style="min-width:260px">'
    + '<button class="btn btn-outline" onclick="onPatentSearch()">搜尋</button>'
    + '</div>'
    + '<div id="patents-body"><div class="hint">載入中…</div></div>';
  const kwInput = el('patent-kw');
  if (kwInput) kwInput.addEventListener('keydown', e => { if (e.key === 'Enter') onPatentSearch(); });
  await loadAllPatents();
}
function onPatentSearch() { state.patentsOffset = 0; loadAllPatents(); }

// ══════════ 瀏覽專利（跟隨頂列選定的 workspace；#C 2026-07-26） ══════════
// 純看專利表格：選全庫→全庫專利（跨 workspace，帶所屬 Workspace 欄）；選一般 ws→該 ws 專利。
// 與分類區（標籤分組）分離：這裡不顯示標籤/分組，只列專利本身。
async function renderBrowse() {
  const m = el('main-panel');
  const scopeLabel = isGlobalSelected() ? '全庫（所有專利）' : '目前 workspace';
  // 版面（2026-07-28 使用者定「太亂了」後重排）：搜尋列只留瀏覽本身，
  // 三塊維護作業全收進「資料維護」details 平時收合——原本它們把專利表推到畫面很下面。
  // 公司名兩塊（代碼組、中文名草稿）合併成一個框：它們本來就是同一條流程
  // （①建組 → ②AI 翻譯 → ③裁決），拆兩處才會讓人問「有沒有連通」。
  m.innerHTML = '<h2 class="panel-title">瀏覽專利</h2>'
    + '<p class="hint" style="padding:0 0 0.6rem">顯示 ' + escHtml(scopeLabel) + ' 的專利。'
    + '<strong>點任一列可展開該件的完整欄位</strong>。</p>'
    + '<div class="toolbar">'
    + '<input class="text-input" id="browse-kw" placeholder="搜尋 專利號／名稱／申請人" style="min-width:260px">'
    + '<button class="btn btn-outline" onclick="onBrowseSearch()">搜尋</button>'
    + '</div>'
    // 維護作業區：平時收合，進頁面先看到專利表。
    + '<details class="maint-details" id="browse-maintenance">'
    + '<summary>資料維護（文獻備註／專利權人代碼與中文名）</summary>'
    // ── 文獻備註 ──
    // 手動觸發（2026-07-27 定案，原匯入後自動觸發已撤回）；只補空值不覆蓋
    // （後端 skip_existing=True），可重複按補齊——這是「匯入去重讓第一次失敗的
    // 批次補不到備註」的唯一出口。
    + '<div class="maint-card">'
    + '<div class="maint-card-title">文獻備註</div>'
    + '<div id="note-coverage" class="hint" style="padding:0 0 .4rem"></div>'
    + '<div class="toolbar" style="margin:0">'
    + (hasRunningJob('ai:patent_note', state.workspaceId)
        ? '<button class="btn" id="btn-patent-note" disabled>產備註中…</button>'
        : '<button class="btn" id="btn-patent-note" onclick="runPatentNotes()">'
          + '產文獻備註</button>')
    + '<span class="hint" style="padding:0;font-size:.8rem">只補空白的備註，不覆蓋既有</span>'
    + '</div></div>'
    // ── 公司名（代碼組 ＋ 既有代碼，同一條流程放同一框）──
    // ⚠ AI 中文名草稿區塊已於 2026-07-29 依使用者定案整個移除（「整個中文名草稿區塊都拿掉」）：
    // 中文名改由使用者直接在代碼組的「公司中文名稱」欄填寫。原本兩個入口做同一件事
    // （AI 草稿裁決 vs 代碼組直接填），屬本專案反覆出現的「同一概念兩處落點」。
    // 後端 ai:company_zh_name 的 job、runner 與端點**保留**，將來要恢復只需接回前端。
    + '<div class="maint-card" id="company-name-block">'
    + '<div class="maint-card-title">專利權人代碼與中文名</div>'
    + '<p class="hint" style="padding:0 0 .5rem">'
    + '流程：<strong>① 建代碼組</strong>（代碼須自行去 WIPS 查，沒有可留空）→ '
    + '<strong>② 直接填公司中文名稱與變體</strong>。'
    + '成果顯示在下方專利表的申請人／專利權人／受讓人欄與相關報表。</p>'
    + '<div id="company-code-registry"></div>'
    + '</div>'
    + '</details>'
    + '<div id="browse-body"><div class="hint">載入中…</div></div>';
  const kwInput = el('browse-kw');
  if (kwInput) kwInput.addEventListener('keydown', e => { if (e.key === 'Enter') onBrowseSearch(); });
  state.browseOffset = 0;
  renderCompanyCodeRegistry();   // 非阻塞：代碼區自己載，不擋專利表
  renderNoteCoverage();          // 同上：備註覆蓋率
  await loadBrowsePatents();
}
function onBrowseSearch() { state.browseOffset = 0; loadBrowsePatents(); }
function pageBrowse(dir) {
  const next = (state.browseOffset || 0) + dir * PATENTS_PAGE_SIZE;
  if (next < 0) return;
  state.browseOffset = next;
  loadBrowsePatents();
}
// ══════════ 專利權人代碼補齊（2026-07-28 使用者需求）══════════
//
// 為什麼要有：代碼是正規化與中文名的**基礎**。company_aliases 空的時候，
// report_patent_base 的四層 COALESCE（代碼對照 > 別稱對照 > 庫內統計名 > 標準化名）
// 全部落空，退回原始「申請人」字面——報表上 CHI HUA 三種寫法各佔一列、中文名全空。
// 實測代碼覆蓋率 60 筆只有 3 筆，等於幾乎全要人工補。
//
// ⚠ 兩條使用者定的紅線：
//   ① 代碼**只能是使用者去 WIPS 查來的**——本區塊不提供自動產生、不讓 AI 建議代碼
//   ② 系統**不預先分組**——待補清單只是省打字的參考，誰跟誰共用代碼由使用者填相同
//      代碼決定。點 chip 只是把字填進當前組，不代表系統認為它們同組。
//
// 成果顯現處：下方專利表的專利權人欄位，以及所有用 applicant_display_name／
// current_assignee_display_name 的報表。
// ── 2026-07-28 四欄拆分＋無代碼備用＋變體維護 ──
// 一組 = 代碼(可空) + 公司中文名稱 + 正規化名稱(英文正式名) + N 個變體。
// 代碼可空：WIPS 要一定數量專利才給代碼，1–3 件的小廠可能永遠沒有；
// 送出時後端會掛 `TEMP:<slug>` 臨時代碼（系統標記，**不冒充 WIPS 代碼**），
// 日後查到真代碼可在既有代碼區用「補代碼」換掉，該組所有變體一起換。
let companyCodeGroups = [];      // [{code, zh_name, normalized_name, variants:[...]}]
let pendingCodeNames = [];       // 待補清單（僅供參考）

async function renderCompanyCodeRegistry() {
  const wrap = el('company-code-registry');
  if (!wrap) return;
  if (!companyCodeGroups.length) companyCodeGroups = [blankCodeGroup()];
  wrap.innerHTML = '<details class="reports-market-details" id="company-code-details">'
    + '<summary>專利權人代碼（正規化與中文名的基礎）</summary>'
    + '<div id="company-code-body"><div class="hint">載入中…</div></div>'
    + '</details>';
  try {
    const [pending, existing, notGrouped] = await Promise.all([
      getJson(API + '/company-codes/pending?limit=200'),
      getJson(API + '/company-codes/existing'),
      // 不歸戶清單（規格批次 c）：與另兩支併發取，不多一輪往返。
      getJson(API + '/company-codes/not-grouped'),
    ]);
    pendingCodeNames = pending.items || [];
    notGroupedNames = notGrouped.items || [];
    renderCompanyCodeBody(existing.items || []);
  } catch (e) {
    const body = el('company-code-body');
    if (body) body.innerHTML = '<div class="task-detail-error">載入失敗：' + escHtml(e.message) + '</div>';
  }
}

function blankCodeGroup() { return { code: '', zh_name: '', normalized_name: '', variants: [''] }; }

// ── 「AI 掃的是已寫入的組」提示（2026-07-28 使用者實機困惑）──
//
// 使用者問「AI 中文名是上面要先寫入資料庫再按 AI 草稿?」——是。runner 的
// PENDING_SQL 只掃 DB 內 review_status='confirmed' 的列，**看不到編輯中尚未寫入
// 的組**。填完一組沒按「確定寫入資料庫」就去按 AI，只會得到「沒有待確認草稿」，
// 完全看不出原因（流程說明那行小字在捲軸上方，下方編輯區看不到）。
//
// 未寫入＝companyCodeGroups 裡任一組有任何欄位非空。寫入成功後
// confirmCompanyCodes() 會把它重置成 [blankCodeGroup()]，故空表＝已寫入。
// ⚠ 判斷必須涵蓋 blankCodeGroup() 的**每一個**欄位（四欄拆分後多了 zh_name／
// normalized_name）；漏一欄就會在「只填了中文名」時漏判。
function unsavedCodeGroupCount() {
  return (companyCodeGroups || []).filter(g => {
    if (!g) return false;
    const filled = (g.code || '').trim()
      || (g.zh_name || '').trim()
      || (g.normalized_name || '').trim()
      || (g.variants || []).some(v => (v || '').trim());
    return !!filled;
  }).length;
}

// ══════════ 不歸戶清單（2026-07-30，規格 applicant-code-grouping-spec.md 批次 c）══════════
//
// 問題：待補清單有些名稱**永遠歸不掉**（實測 11 項中 7 個自然人、1 個 DBA 機構），
// 手動也歸不進任何組，於是永遠掛著，每次看到都要重新判斷一次。
//
// ⚠ 標記**不是刪除**：後端只寫一列 source_type='filter'，隨時可還原。
// ⚠ 顯示**完全不變**：後端把「正規化名稱」填成該名稱本身，報表反查照樣顯示原名。
let notGroupedNames = [];

function renderNotGroupedNames() {
  if (!notGroupedNames.length) return '';
  return '<details style="margin-top:.5rem">'
    + '<summary>不歸戶的名稱（' + notGroupedNames.length + ' 個）</summary>'
    + '<p class="hint" style="padding:.3rem 0 .3rem 1rem">'
    + '這些名稱不併入任何代碼組，已從待補清單移除；專利表與報表的顯示維持原樣。</p>'
    + '<ul style="margin:.2rem 0 .2rem 1.6rem;font-size:.85rem;list-style:none;padding:0">'
    + notGroupedNames.map(it =>
        '<li style="padding:.12rem 0">' + escHtml(it.name)
        + ' <button class="btn-mini" onclick="restoreNotGroupedName(' + it.id + ')">還原</button>'
        + '</li>').join('')
    + '</ul></details>';
}

// 把待補清單的某個名稱標為不歸戶（第三個入口，✕）。
async function markNameNotGrouped(i) {
  const item = pendingCodeNames[i];
  if (!item) return;
  if (!confirm('把「' + item.name + '」標為不歸戶？\n\n'
      + '它會從待補清單移除，但專利表與報表的顯示不變。之後可在「不歸戶的名稱」還原。')) return;
  try {
    const resp = await fetch(API + '/company-codes/not-grouped', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: item.name }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('標記失敗：' + (err.detail || resp.status));
      return;
    }
    await renderCompanyCodeRegistry();   // 重載：該名稱會離開待補清單
  } catch (e) {
    alert('連線錯誤：' + e.message);
  }
}

// 還原：刪掉標記列，該名稱重新出現在待補清單。
async function restoreNotGroupedName(aliasId) {
  try {
    const resp = await fetch(API + '/company-codes/not-grouped/' + aliasId, { method: 'DELETE' });
    if (!resp.ok) { alert('還原失敗：' + resp.status); return; }
    await renderCompanyCodeRegistry();
  } catch (e) {
    alert('連線錯誤：' + e.message);
  }
}

// 有未寫入的組就在 AI 鈕旁警示，並指出補救動作（按「確定寫入資料庫」）。
function unsavedCodeGroupsWarningHtml() {
  const n = unsavedCodeGroupCount();
  if (!n) return '';
  return '<div class="code-conflict" style="margin-top:.4rem">⚠ 目前有 ' + n
    + ' 組尚未寫入，AI 不會處理它們——請先在上方代碼區按「確定寫入資料庫」。</div>';
}

// 既有代碼組的當前快照（集中入口的下拉要據此帶入代碼／中文名／正規化名稱）。
// 存全域而非只當參數：addVariantToGroup 在使用者按下按鈕時才需要它。
let existingCompanyGroups = [];

function renderCompanyCodeBody(existingGroups) {
  existingCompanyGroups = existingGroups || [];
  const body = el('company-code-body');
  if (!body) return;
  body.innerHTML =
    // ④ 待補清單收進 details（33 個 chip 會佔掉半個畫面，只在填變體時才需要）。
    // 只列名稱與數量，不分組、不排序暗示關聯（見上方紅線②）。
    '<details id="pending-codes-details">'
    + '<summary>待補代碼的專利權人（' + pendingCodeNames.length + ' 種）</summary>'
    + '<p class="hint" style="padding:.3rem 0">點一下填入目前編輯中的變體格；'
    + '<strong>系統不判斷誰跟誰是同一家</strong>，請依 WIPS 查到的代碼自行分組。</p>'
    + '<div style="max-height:9rem;overflow:auto;margin-bottom:.5rem">'
    + (pendingCodeNames.length
        ? pendingCodeNames.map((it, i) =>
            // 標籤本體＝填入變體格（既有行為不變，使用者定「先試試 C」）；
            // 放大鏡＝篩出使用這個名稱的專利（2026-07-29 新增），stopPropagation 免觸發填入。
            '<span class="pending-chip" onclick="fillVariantFromPending(' + i + ')" title="'
            + escHtml((it.source_fields || []).join('、')) + '">'
            + escHtml(it.name) + '<span class="n">' + escHtml(it.patent_count) + '</span>'
            + '<span class="chip-find" title="看看是哪些專利"'
            + ' onclick="event.stopPropagation();showPendingNamePatents(' + i + ')">🔍</span>'
            // 第三個入口（2026-07-30，規格批次 c）：標為不歸戶。
            // ⚠ 前兩個入口（點擊填入變體、🔍 篩專利）維持不變。
            // 措辭用「不歸戶」不用「忽略」「個人」——那些名稱不只是自然人（含機構），
            // 描述的是動作不是身分。
            + '<span class="chip-find" title="這個名稱歸不了任何組，標為不歸戶"'
            + ' onclick="event.stopPropagation();markNameNotGrouped(' + i + ')">✕</span>'
            + '</span>').join('')
        : '<span class="hint">（無待補項目）</span>')
    + '</div></details>'
    + '<div id="code-groups">' + companyCodeGroups.map(codeGroupHtml).join('') + '</div>'
    // ③ 這裡不再放 AI 鈕：它與草稿區的「產生公司中文名草稿」打的是**同一支端點**
    // （POST /company-zh-drafts/generate），兩顆同功能且這顆位置誤導——看起來像
    // 「翻譯我現在填的這組」，實際是掃全庫已 confirmed 的代碼產草稿。唯一入口留在
    // 下方草稿區（緊鄰裁決介面，語意才對）。
    + '<div class="toolbar">'
    + '<button class="btn btn-outline" onclick="addCodeGroup()">＋ 新增一組</button>'
    + '<button class="btn btn-primary" id="btn-code-confirm" onclick="confirmCompanyCodes()">確定寫入資料庫</button>'
    + '</div>'
    + '<div id="code-submit-msg"></div>'
    // 既有代碼：平時收合，展開看代碼，再展開看該代碼下的公司變體（使用者指定的兩層）。
    // 2026-07-28 起每組可維護：改名、補真代碼（TEMP 組）、刪整組、移除單一變體。
    + '<details id="existing-codes-details" style="margin-top:.6rem">'
    + '<summary>資料庫已有的代碼（' + existingGroups.length + ' 組）</summary>'
    + (existingGroups.length
        ? existingGroups.map(existingGroupHtml).join('')
        : '<p class="hint" style="padding:.3rem 0 0 1rem">（尚無已確認的代碼）</p>')
    + '</details>'
    // 不歸戶清單（2026-07-30，規格批次 c）：⚠ 不新增大區塊，掛在既有代碼區之後。
    + renderNotGroupedNames()
    // 新增變體集中入口（2026-07-29 使用者定「做成集中入口」「一個區塊下拉選組」）：
    // 原本要把新寫法歸進既有組，只能繞路用上方「新增一組」表單填既有代碼，
    // 且中文名與正規化名稱必須完全一致否則 409。這裡選了組就自動帶入那三個值，
    // 使用者只填變體字面。無既有組時不顯示（沒得選）。
    + (existingGroups.length
        ? '<div class="card" style="margin-top:.6rem">'
          + '<div style="font-weight:600;margin-bottom:.4rem">新增變體到既有組</div>'
          + '<p class="hint" style="padding:0 0 .4rem">'
          + '把新的公司寫法歸進已建立的代碼組；代碼與公司名沿用該組現值，只需填寫法。</p>'
          + '<div class="toolbar">'
          + '<select class="text-input" id="add-variant-group-select" style="max-width:26rem">'
          + addVariantGroupOptionsHtml(existingGroups) + '</select>'
          + '<input class="text-input" id="add-variant-alias" placeholder="新的公司寫法（原始字面）" style="min-width:18rem">'
          + '<button class="btn btn-primary" onclick="addVariantToGroup()">新增</button>'
          + '</div></div>'
        : '')
    + '<div id="group-maint-msg"></div>';
}

// 選組下拉的選項：顯示「代碼 — 公司名」，value 用代碼（送出時再查回整組資料）。
function addVariantGroupOptionsHtml(groups) {
  return (groups || []).map(g => {
    const label = g.code + (g.company_name ? ' — ' + g.company_name : '');
    return '<option value="' + escHtml(g.code) + '">' + escHtml(label) + '</option>';
  }).join('');
}

// 新增變體：走既有 POST /company-codes/confirm（後端 apply_confirmed_display_names
// 對「別稱不存在」本來就是 INSERT，不覆蓋既有列）——**不另造端點**，
// 否則寫入規則會有第二個落點。
// ⚠ payload 必須帶該組的 zh_name／normalized_name：後端 find_code_conflicts 比對
// 「同代碼是否配到不同正規化名稱」，少帶或帶錯就 409。
async function addVariantToGroup() {
  const code = (el('add-variant-group-select') || {}).value || '';
  const aliasInput = el('add-variant-alias');
  const alias = ((aliasInput || {}).value || '').trim();
  if (!code || !alias) { alert('請選擇代碼組並填寫變體。'); return; }
  const group = existingCompanyGroups.find(g => g.code === code);
  if (!group) { alert('找不到該代碼組，請重新載入。'); return; }
  // ⚠ 欄位名是 `variants` 不是 `aliases`——後端 CodeGroup model 用前者，
  // 而 Pydantic 對未知欄位**靜默忽略**：送錯名時變體被丟掉、只更新兩個正式名的列，
  // API 照回 200（實測 inserted:0 updated:2），使用者以為成功但資料沒進去。
  const payload = { groups: [{
    code: code,
    zh_name: group.zh_name || '',
    normalized_name: group.normalized_name || '',
    variants: [alias],
  }] };
  const ok = await callGroupMaintenance(
    API + '/company-codes/confirm',
    { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload) },
    '已新增變體「' + alias + '」，正在刷新收斂名。');
  if (ok !== false && aliasInput) aliasInput.value = '';
  return ok;
}

// 既有代碼的一組：兩層展開 ＋ 維護操作（改名／補代碼／刪組／移除變體）。
// ⚠ canonical 那列（別稱字面＝該組正式名）**不給刪**：它被刪掉整組顯示名會壞
// （寫入端會把正式名自身也寫成一列別稱，顯示靠它精確命中）。後端也會擋（409），
// 這裡不畫按鈕只是避免使用者白按一次。
function existingGroupHtml(g) {
  const codeJs = JSON.stringify(g.code);
  // 待確認組（2026-07-30，規格 applicant-code-grouping-spec.md b4）：
  // 匯入時「有 WIPS 代碼但未建組」會自動建組，代碼／英文正式名／別稱三欄由 WIPS
  // 直接推導，⚠ 中文名一律留空（市場慣用名是判斷不是資料）。
  // ⚠ 措辭不得出現 AI／建議／草稿——本路徑是確定性規則，無 AI 參與（使用者明示）。
  const pending = g.review_status === 'review_required';
  // 無中文名時顯示英文正式名＋「待補中文名」標記，不留空白（使用者定）。
  const shownName = g.company_name || g.normalized_name || g.code;
  return '<details style="margin:.3rem 0 .3rem 1rem">'
    + '<summary>' + escHtml(g.code)
    + (g.is_temp ? ' <span class="hint">（尚無 WIPS 代碼）</span>' : '')
    + ' — ' + escHtml(shownName)
    + (pending ? ' <span class="ver-badge ver-badge-ai">待補中文名</span>' : '')
    + '（' + g.variants.length + ' 個變體）</summary>'
    + '<div style="margin:.3rem 0 .3rem 1.6rem">'
    + '<div class="code-field"><label>公司中文名稱</label>'
    + '<input class="text-input" id="rn-zh-' + escHtml(g.code) + '" value="' + escHtml(g.zh_name || '') + '"></div>'
    + '<div class="code-field"><label>正規化名稱</label>'
    + '<input class="text-input" id="rn-en-' + escHtml(g.code) + '" value="' + escHtml(g.normalized_name || '') + '"></div>'
    + '<div class="toolbar">'
    + '<button class="btn-mini" onclick=\'renameCompanyGroup(' + codeJs + ')\'>儲存公司名</button>'
    // 補真代碼：使用者去 WIPS 查到之後填進來取代 TEMP（系統不產生代碼）。
    + (g.is_temp
        ? '<input class="text-input" id="pc-' + escHtml(g.code) + '" placeholder="WIPS 查到的真代碼"'
          + ' style="max-width:14rem">'
          + '<button class="btn-mini" onclick=\'promoteCompanyCode(' + codeJs + ')\'>補上代碼</button>'
        : '')
    // 待確認組多一顆「確認」：review_required → confirmed，一鍵進正式顯示。
    // ⚠ 中文名可填可留空——留空時顯示自然退回英文正式名（與報表同一順位）。
    + (pending
        ? '<button class="btn-mini" style="background:var(--accent);color:#fff"'
          + ' onclick=\'confirmPendingCodeGroup(' + codeJs + ')\'>確認這組</button>'
        : '')
    + '<button class="btn-mini" onclick=\'deleteCompanyGroup(' + codeJs + ')\'>刪除整組</button>'
    + '</div>'
    + (pending
        ? '<p class="hint" style="padding:.2rem 0 0;font-size:.78rem">'
          + '此組由匯入時依 WIPS 代碼自動建立，中文名待補。'
          + '確認後才會進入專利表與報表顯示。</p>'
        : '')
    + '<ul style="margin:.2rem 0 .2rem 0;font-size:.85rem;list-style:none;padding:0">'
    + g.variants.map(v =>
        '<li style="padding:.1rem 0">' + escHtml(v.alias)
        + (v.is_canonical
            ? ' <span class="hint">（正式名本身，不可移除）</span>'
            : ' <button class="btn-mini" onclick="removeCompanyVariant(' + v.id + ')">移除</button>')
        + '</li>').join('')
    + '</ul></div></details>';
}

// 維護操作共用收尾：顯示結果、重載清單、重載專利表（成果直接對照）。
// ⚠ 三個端點都會 enqueue refresh_derived；這裡順帶刷任務卡讓使用者看得到進度。
async function afterGroupMaintenance(text) {
  const msg = el('group-maint-msg');
  if (msg) msg.innerHTML = '<p class="hint" style="padding:.35rem 0">' + escHtml(text) + '</p>';
  await fetchTasks();
  await renderCompanyCodeRegistry();
  await loadBrowsePatents();
}

async function callGroupMaintenance(url, options, okText) {
  const msg = el('group-maint-msg');
  try {
    const resp = await fetch(url, options);
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      if (msg) msg.innerHTML = '<div class="task-detail-error">操作失敗：'
        + escHtml(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail || resp.status))
        + '</div>';
      return;
    }
    await afterGroupMaintenance(okText);
  } catch (e) {
    if (msg) msg.innerHTML = '<div class="task-detail-error">連線錯誤：' + escHtml(e.message) + '</div>';
  }
}

function removeCompanyVariant(aliasId) {
  if (!confirm('移除這個變體？該寫法會退回待補清單，其專利的公司名回原始字面。')) return;
  return callGroupMaintenance(
    API + '/company-codes/variants/' + encodeURIComponent(aliasId),
    { method: 'DELETE' },
    '已移除變體，正在刷新收斂名。');
}

function renameCompanyGroup(code) {
  const zh = (el('rn-zh-' + code) || {}).value || '';
  const en = (el('rn-en-' + code) || {}).value || '';
  return callGroupMaintenance(
    API + '/company-codes/' + encodeURIComponent(code),
    { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zh_name: zh.trim(), normalized_name: en.trim() }) },
    '已更新公司名，正在刷新收斂名。');
}

// 確認待確認組（2026-07-30，規格 b4）：review_required → confirmed。
// ⚠ 複用既有 PATCH 端點——`apply_confirmed_display_names` 的 UPDATE 明文
// 「review_status 一律轉 confirmed」，故改名即轉正，不另造第二條寫入路徑。
// 中文名可留空：顯示會自然退回英文正式名（與報表同一順位）。
function confirmPendingCodeGroup(code) {
  const zh = ((el('rn-zh-' + code) || {}).value || '').trim();
  const en = ((el('rn-en-' + code) || {}).value || '').trim();
  if (!zh && !en) {
    const msg = el('group-maint-msg');
    if (msg) msg.innerHTML = '<div class="code-conflict">中文名與英文正式名至少要有一個。</div>';
    return;
  }
  return callGroupMaintenance(
    API + '/company-codes/' + encodeURIComponent(code),
    { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zh_name: zh, normalized_name: en }) },
    '已確認這組，正在刷新收斂名。');
}

function deleteCompanyGroup(code) {
  if (!confirm('刪除整組「' + code + '」？該組專利的公司名會退回原始字面。')) return;
  return callGroupMaintenance(
    API + '/company-codes/' + encodeURIComponent(code),
    { method: 'DELETE' },
    '已刪除整組，正在刷新收斂名。');
}

function promoteCompanyCode(code) {
  const input = el('pc-' + code);
  const newCode = ((input && input.value) || '').trim();
  if (!newCode) {
    const msg = el('group-maint-msg');
    if (msg) msg.innerHTML = '<div class="code-conflict">請先填入 WIPS 查到的代碼。</div>';
    return;
  }
  return callGroupMaintenance(
    API + '/company-codes/' + encodeURIComponent(code) + '/promote',
    { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_code: newCode }) },
    '已補上代碼 ' + newCode + '，正在刷新收斂名。');
}

function codeGroupHtml(g, idx) {
  return '<div class="code-group" data-group="' + idx + '">'
    + '<div class="code-group-head"><span class="idx">第 ' + (idx + 1) + ' 組</span>'
    + '<button class="btn-mini" onclick="removeCodeGroup(' + idx + ')">刪除本組</button>'
    // 填入目標（2026-07-29 使用者回報「標籤只會出現在第一組」）：原本只靠變體格的
    // onfocus 記錄目標，使用者沒先點過任何格子時 activeVariant 停在 {g:0,v:0}
    // → 點待補清單永遠填到第 1 組，而畫面上**沒有任何提示**。改為明示且可直接指定。
    // btn-active-target：供 syncActiveGroupButtons() 就地更新高亮，免整區重繪（見該函式）。
    + '<button class="btn-mini btn-active-target" onclick="setActiveVariant(' + idx + ', 0)"'
    + (activeVariant.g === idx ? ' style="background:var(--accent);color:#fff"' : '')
    + '>' + (activeVariant.g === idx ? '● 待補清單填這組' : '填這組') + '</button></div>'
    // 代碼可留空（見上方說明）：留空時後端掛 TEMP: 臨時代碼，仍可正常收斂。
    + '<div class="code-field"><label>代碼</label>'
    + '<input class="text-input" value="' + escHtml(g.code) + '" placeholder="WIPS 查到的申請人代碼（沒有可留空）"'
    + ' oninput="updateCodeGroup(' + idx + ', \'code\', this.value)"></div>'
    // 四欄拆分：中文正式名與英文正式名分兩格填，不再擠同一欄。兩欄都可空。
    + '<div class="code-field"><label>公司中文名稱</label>'
    + '<input class="text-input" value="' + escHtml(g.zh_name) + '" placeholder="中文正式名（顯示第一順位；沒有可留空）"'
    + ' oninput="updateCodeGroup(' + idx + ', \'zh_name\', this.value)"></div>'
    + '<div class="code-field"><label>正規化名稱</label>'
    + '<input class="text-input" value="' + escHtml(g.normalized_name) + '" placeholder="英文正式名（沒中文時顯示這個）"'
    + ' oninput="updateCodeGroup(' + idx + ', \'normalized_name\', this.value)"></div>'
    + '<div class="code-field" style="align-items:flex-start"><label>變體</label><div style="flex:1 1 auto;min-width:0">'
    + g.variants.map((v, vi) =>
        '<div class="code-variant-row">'
        // ⚠ placeholder 要講明「兩種都行」：原文「點上方清單可填入」讓使用者以為
        // 只能點標籤、不能打字（2026-07-29 使用者回報）。欄位本來就可自由輸入
        // （無 readonly、oninput 已接 updateVariant），是文案誤導不是功能缺漏。
        + '<input class="text-input" value="' + escHtml(v) + '" placeholder="原始寫法（可直接打字，或點上方標籤填入）"'
        + ' onfocus="setActiveVariant(' + idx + ', ' + vi + ')"'
        + ' oninput="updateVariant(' + idx + ', ' + vi + ', this.value)">'
        + (g.variants.length > 1
            ? '<button class="btn-mini" onclick="removeCodeVariant(' + idx + ', ' + vi + ')">－</button>'
            : '')
        + '</div>').join('')
    + '<button class="btn-mini" onclick="addCodeVariant(' + idx + ')">＋ 新增變體</button>'
    + '</div></div></div>';
}

// 目前游標所在的變體格；點待補清單時填到這裡（使用者可先點格子指定要填哪一組）
let activeVariant = { g: 0, v: 0 };

function addCodeGroup() { companyCodeGroups.push(blankCodeGroup()); redrawCodeGroups(); }
function removeCodeGroup(i) {
  companyCodeGroups.splice(i, 1);
  if (!companyCodeGroups.length) companyCodeGroups = [blankCodeGroup()];
  activeVariant = { g: 0, v: 0 };
  redrawCodeGroups();
}
function addCodeVariant(i) { companyCodeGroups[i].variants.push(''); redrawCodeGroups(); }
function removeCodeVariant(i, vi) {
  companyCodeGroups[i].variants.splice(vi, 1);
  if (!companyCodeGroups[i].variants.length) companyCodeGroups[i].variants = [''];
  redrawCodeGroups();
}
function updateCodeGroup(i, field, value) { companyCodeGroups[i][field] = value; }
function updateVariant(i, vi, value) { companyCodeGroups[i].variants[vi] = value; }

// 只重畫組區塊，不重打 API（待補清單與既有代碼不變）
// 設定「待補清單要填進哪一組哪一格」並重繪，讓標示即時反映。
// ⚠ 重繪會重建 DOM、輸入框失焦——但 activeVariant 是變數不受影響，
// 這正是修正前的隱性問題：狀態在但畫面沒有任何提示。
function setActiveVariant(g, v) {
  // ⚠ **不呼叫 redrawCodeGroups()**（2026-07-29 使用者回報「變體要能自己打字」）：
  // 本函式由變體格的 onfocus 呼叫，而重繪會重建整區 DOM 讓輸入框**當場失焦**——
  // 點一下游標就被踢出，要再點第二次才打得了字，體感就是「這格不能輸入」。
  // 欄位其實從來沒被鎖（無 readonly、oninput 已接 updateVariant）。
  //
  // 目標變更時只需更新「填這組」按鈕的樣式與文字（唯一會隨 activeVariant 變的畫面），
  // 直接改那幾顆按鈕即可，不必重建輸入框。
  activeVariant = { g: g, v: v };
  syncActiveGroupButtons();
}

// 只同步「填這組」按鈕的高亮與文字，不動輸入框（避免打字中被重繪打斷）。
function syncActiveGroupButtons() {
  const box = el('code-groups');
  if (!box) return;
  box.querySelectorAll('.code-group').forEach((node) => {
    const isActive = Number(node.dataset.group) === activeVariant.g;
    const btn = node.querySelector('.btn-active-target');
    if (!btn) return;
    btn.style.background = isActive ? 'var(--accent)' : '';
    btn.style.color = isActive ? '#fff' : '';
    btn.textContent = isActive ? '● 待補清單填這組' : '填這組';
  });
}

function redrawCodeGroups() {
  const box = el('code-groups');
  if (box) box.innerHTML = companyCodeGroups.map(codeGroupHtml).join('');
}

// ══════════ 待補標籤 → 篩選專利（2026-07-29 使用者需求） ══════════
// 使用者：「如果專利權人標籤拿去搜尋，但這間公司的欄位，在前端沒有出現，這樣我無法篩選」。
// 標籤本來就知道自己的來源欄位（後端已回 source_fields），該用欄位精準篩，
// 不丟進全文搜尋——既有搜尋只吃 applicant_display_name，專利權人／受讓人一律 0 筆。
//
// 流程（使用者定）：點放大鏡 → **跳到完整專利表格**（欄位齊全，看得到「詳細查看連結」）
// → 使用者點連結去 WIPS 對照 → 回來決定要不要把這個名稱加進變體。
// ⚠ 跳頁不會弄丟填到一半的代碼組：companyCodeGroups 是 JS 變數不是 DOM。
async function showPendingNamePatents(i) {
  const item = pendingCodeNames[i];
  if (!item) return;
  try {
    const data = await getJson(API + '/company-codes/pending/'
      + encodeURIComponent(item.lookup_key) + '/patents');
    const ids = data.patent_ids || [];
    if (!ids.length) { alert('查無使用「' + item.name + '」的專利。'); return; }
    state.pendingNameFilter = { name: item.name, ids: ids };
    state.browseOffset = 0;
    navTo('browse');
  } catch (e) {
    alert('篩選失敗：' + e.message);
  }
}

// 清掉篩選回到全部——否則使用者被困在篩選狀態、以為庫裡只剩這幾筆。
function clearPendingNameFilter() {
  state.pendingNameFilter = null;
  state.browseOffset = 0;
  loadBrowsePatents();
}

function fillVariantFromPending(i) {
  const item = pendingCodeNames[i];
  if (!item) return;
  const g = companyCodeGroups[activeVariant.g];
  if (!g) return;
  // 填進游標所在格；該格已有內容就新增一格，不覆蓋使用者打過的字
  if ((g.variants[activeVariant.v] || '').trim()) {
    g.variants.push(item.name);
    activeVariant = { g: activeVariant.g, v: g.variants.length - 1 };
  } else {
    g.variants[activeVariant.v] = item.name;
  }
  redrawCodeGroups();
}

// 文獻備註覆蓋率：不顯示的話看不出還缺幾筆、要不要按（2026-07-28 排版整理時補）。
async function renderNoteCoverage() {
  const box = el('note-coverage');
  if (!box) return;
  try {
    const qs = 'limit=1&offset=0';
    const url = isGlobalSelected()
      ? API + '/patents?' + qs
      : API + '/workspaces/' + encodeURIComponent(state.workspaceId) + '/patents?' + qs;
    const data = await getJson(url);
    const total = data.total ?? 0;
    box.textContent = total ? ('本範圍共 ' + total + ' 件；按下方鈕補齊尚無備註者。') : '';
  } catch (e) {
    box.textContent = '';   // 靜默：覆蓋率只是輔助資訊，載不到不擋維護作業
  }
}

async function confirmCompanyCodes() {
  const msg = el('code-submit-msg');
  // ⚠ 2026-07-28 起**不再過濾 `g.code &&`**：代碼可空（無 WIPS 代碼的小廠），
  // 後端會掛 TEMP: 臨時代碼。仍要求「至少一個正式名 ＋ 至少一個變體」——
  // 兩者缺一就沒有東西可寫（不是驗證嚴格，是真的寫不出列）。
  const groups = companyCodeGroups
    .map(g => ({
      code: (g.code || '').trim(),
      zh_name: (g.zh_name || '').trim(),
      normalized_name: (g.normalized_name || '').trim(),
      variants: (g.variants || []).map(v => (v || '').trim()).filter(Boolean),
    }))
    .filter(g => (g.zh_name || g.normalized_name) && g.variants.length);
  if (!groups.length) {
    if (msg) msg.innerHTML = '<div class="code-conflict">'
      + '請至少填一組：公司中文名稱或正規化名稱擇一（兩個都填最好）＋ 至少一個變體。'
      + '代碼沒有可以留空。</div>';
    return;
  }
  const btn = el('btn-code-confirm');
  if (btn) { btn.disabled = true; btn.textContent = '寫入中…'; }
  try {
    const resp = await fetch(API + '/company-codes/confirm', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ groups: groups }),
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.status === 409) {
      // 同一代碼配到不同正規化名稱＝真衝突（使用者定的唯一驗證）
      const list = ((data.detail || {}).conflicts || [])
        .map(c => escHtml(c.code) + '：已是「' + escHtml(c.existing_name)
          + '」，這次填「' + escHtml(c.new_name) + '」').join('<br>');
      if (msg) msg.innerHTML = '<div class="code-conflict">代碼衝突，未寫入：<br>' + list + '</div>';
      return;
    }
    if (!resp.ok) {
      if (msg) msg.innerHTML = '<div class="task-detail-error">寫入失敗：'
        + escHtml(JSON.stringify(data.detail || resp.status)) + '</div>';
      return;
    }
    companyCodeGroups = [blankCodeGroup()];
    activeVariant = { g: 0, v: 0 };
    if (msg) msg.innerHTML = '<p class="hint" style="padding:.35rem 0">已寫入 '
      + escHtml(data.groups) + ' 組；正在刷新收斂名（下方表格與報表隨後更新）。</p>';
    await fetchTasks();
    await renderCompanyCodeRegistry();
    await loadBrowsePatents();   // 成果直接在下方專利權人欄位對照
  } catch (e) {
    if (msg) msg.innerHTML = '<div class="task-detail-error">連線錯誤：' + escHtml(e.message) + '</div>';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '確定寫入資料庫'; }
  }
}

// 載當前 workspace 的專利：全庫走 /patents（跨庫、帶所屬 workspace 欄）；一般 ws 走 /workspaces/{id}/patents。
async function loadBrowsePatents() {
  const body = el('browse-body');
  if (!body) return;
  const kw = (el('browse-kw') && el('browse-kw').value.trim()) || '';
  const off = state.browseOffset || 0;
  // 待補標籤篩選（2026-07-29）：帶著 patent_id 集合來的，改走 id 過濾而非關鍵字，
  // 因為待補名稱來自**原始 WIPS 欄位**，關鍵字搜的是收斂顯示名，兩者對不上。
  const nameFilter = state.pendingNameFilter;
  try {
    let data;
    if (nameFilter) {
      // ⚠ 後端 /patents 沒有 patent_ids 參數（只有 keyword／limit／offset），
      // 不為此新增 API：命中集合通常只有數筆～數十筆，取回本頁後在前端以 id 過濾即可。
      // limit 取 API 上限 200，超過 200 筆的名稱會被截斷——見下方 banner 的提示。
      const base = isGlobalSelected()
        ? API + '/patents?'
        : API + '/workspaces/' + encodeURIComponent(state.workspaceId) + '/patents?';
      const all = await getJson(base + 'limit=200&offset=0');
      const idSet = new Set(nameFilter.ids);
      const hit = (all.items || []).filter(p => idSet.has(p.patent_id));
      data = { items: hit, total: hit.length, offset: 0, limit: hit.length };
      body.innerHTML = pendingFilterBannerHtml(nameFilter, hit.length)
        + browsePatentsTableHtml(data, isGlobalSelected() ? 'overview' : 'topics');
    } else if (isGlobalSelected()) {
      const qs = 'limit=' + PATENTS_PAGE_SIZE + '&offset=' + off
        + (kw ? '&keyword=' + encodeURIComponent(kw) : '');
      data = await getJson(API + '/patents?' + qs);
      body.innerHTML = browsePatentsTableHtml(data, 'overview');
    } else {
      const qs = 'limit=' + PATENTS_PAGE_SIZE + '&offset=' + off
        + (kw ? '&keyword=' + encodeURIComponent(kw) : '');
      data = await getJson(API + '/workspaces/' + encodeURIComponent(state.workspaceId)
        + '/patents?' + qs);
      body.innerHTML = browsePatentsTableHtml(data, 'topics');
    }
  } catch (e) {
    body.innerHTML = '<div class="card">載入專利失敗（' + escHtml(e.message) + '）。</div>';
  }
}
// 篩選中的提示帶：使用者要知道「現在只看到一部分」，且要有路回到全部。
// ⚠ 少了這條，畫面看起來就像庫裡只剩這幾筆——正是本專案常見的靜默狀態。
function pendingFilterBannerHtml(filter, shown) {
  const expected = (filter.ids || []).length;
  // 命中數與後端算出的數量不符＝被 limit=200 截斷或不在目前 workspace，要講出來不能靜默。
  const gap = expected > shown
    ? '<span class="flag-no" style="margin-left:.5rem">'
      + '（後端命中 ' + expected + ' 筆，此處顯示 ' + shown
      + '；差額為不在目前 workspace 或超出單頁上限）</span>'
    : '';
  return '<div class="card" style="margin-bottom:.6rem">'
    + '篩選：使用「<strong>' + escHtml(filter.name) + '</strong>」的專利 '
    + shown + ' 筆' + gap
    + ' <button class="btn btn-outline btn-sm" style="margin-left:.6rem"'
    + ' onclick="clearPendingNameFilter()">清除篩選</button>'
    + '<p class="hint" style="padding:.3rem 0 0">'
    + '點各列的「詳細查看連結」到 WIPS 對照，確認是不是同一家後再回代碼區加入變體。</p>'
    + '</div>';
}

// 瀏覽專利表＋分頁（沿用 patentTableHtml；scope 決定欄位集合）。
function browsePatentsTableHtml(data, scope) {
  const items = data.items || [];
  if (items.length === 0) return '<div class="hint">查無符合的專利。</div>';
  const total = data.total ?? items.length;
  const off = data.offset ?? 0;
  const from = off + 1;
  const to = off + items.length;
  return patentTableHtml(data, scope)
    + '<div class="pager">'
    + '<button class="btn btn-outline" ' + (off > 0 ? '' : 'disabled') + ' onclick="pageBrowse(-1)">上一頁</button>'
    + '<span>' + from + '–' + to + ' / 共 ' + total + ' 件</span>'
    + '<button class="btn btn-outline" ' + (to < total ? '' : 'disabled') + ' onclick="pageBrowse(1)">下一頁</button>'
    + '</div>';
}
// 全庫專利：走 GET /patents（跨 workspace），一律分頁（PATENTS_PAGE_SIZE），不一次撈全部。
async function loadAllPatents() {
  const body = el('patents-body');
  if (!body) return;
  const kw = (el('patent-kw') && el('patent-kw').value.trim()) || '';
  const qs = 'limit=' + PATENTS_PAGE_SIZE + '&offset=' + state.patentsOffset
    + (kw ? '&keyword=' + encodeURIComponent(kw) : '');
  try {
    const data = await getJson(API + '/patents?' + qs);
    body.innerHTML = allPatentsTableHtml(data);
  } catch (e) {
    body.innerHTML = '<div class="card">載入專利失敗（'
      + escHtml((e && e.message) || '未知錯誤') + '）。</div>';
  }
}

// 連結欄：有值才輸出可點的 <a>；無值不輸出空連結（顯示空白）。
function linkCell(url, text) {
  const href = (url || '').trim();

}
// 欄位寬度 class（2026-07-26 使用者定案：所有欄一行放不完都換行、不截斷）：
//   fulltext＝整段敘述（摘要/摘要原文/文獻備註）最寬——26rem 下一句話會斷成七八行，
//     不利閱讀（2026-07-27 使用者回報）；long＝一般長文（標題等）較寬；
//   wrap/wide＝一般換行欄較窄；nowrap＝極短欄（國別/年份/日期）不換行；
//   未標＝預設可換行、中等寬。fulltext 優先於 long（兩者常同時標記）。
function cellClassAttr(col) {
  if (col.fulltext) return ' class="cell-xlong"';
  if (col.long) return ' class="cell-long"';
  if (col.wrap || col.wide) return ' class="cell-wrap"';
  if (col.nowrap) return ' class="cell-nowrap"';
  return '';
}
// 依欄位定義取一格內容。空值一律回空字串（欄位仍在，只是沒值）。
// 一律全文顯示、不截斷（列表與詳情皆然）——由 CSS 換行處理長文，不砍字加…。
function patentCell(p, col, mode) {
  if (col.render) return col.render(p);
  const v = p[col.key];
  if (v === null || v === undefined || v === '') return '';
  return escHtml(String(v));
}
// 第一層列表的最後一欄（2026-07-27 使用者定：「第一層修成只顯示到文獻備註」）。
// 沿革：原設計只顯示 listOnly 的 9 欄 → 2026-07-26 改為全 27 欄攤開橫向捲 →
// 實測要捲很久才看得到重點，故改為**切到文獻備註為止**（前 8 欄左右）。
// 其餘欄位不是拿掉，是收進點列展開的詳情層——完整欄位仍看得到。
const LIST_LAST_COLUMN_KEY = 'patent_note';

// 專利表（專利總覽與分類區**共用同一份實作**，只差 scope 決定的欄位集合）：
// 第一層只到「文獻備註」，其餘欄位在詳情層。橫向捲動仍由 .table-wrap 的
// overflow-x: auto 提供（欄寬設定不變）。
// 點列展開的詳情層：列表受 truncate 截斷的長文欄（摘要／文獻備註）在詳情看全文。
function patentTableHtml(data, scope) {
  const items = data.items || [];
  if (items.length === 0) return '<div class="hint">查無符合的專利。</div>';
  const cols = patentColumns(scope);
  // 切到 LIST_LAST_COLUMN_KEY 為止；找不到該欄時退回全欄（不讓表格整個空掉）。
  const lastIdx = cols.findIndex(c => c.key === LIST_LAST_COLUMN_KEY);
  const listCols = lastIdx >= 0 ? cols.slice(0, lastIdx + 1) : cols;
  // 詳情列的 colspan＝列表欄數（由欄位定義推導，不寫死數字）。
  const rows = items.map((p, i) =>
    '<tr class="patent-row-clickable" onclick="togglePatentDetail(\'' + scope + '\',' + i + ')">'
    + listCols.map(c =>
      // 欄寬三態：long＝真長文（標題/摘要/備註，寬）；wrap/wide＝一般換行（原文/公司名，窄）；
      // nowrap＝極短欄（國別/年份/日期，不換行）。未標者走預設（可換行、中等寬）。
      '<td' + cellClassAttr(c) + '>' + patentCell(p, c, 'list') + '</td>'
    ).join('')

    + '<tr class="patent-detail-row" id="patent-detail-' + scope + '-' + i + '" hidden>'
    + '<td colspan="' + listCols.length + '">' + patentDetailHtml(p, scope) + '</td></tr>'
  ).join('');

    + '<thead><tr>'
    + listCols.map(c => '<th' + cellClassAttr(c) + '>' + escHtml(c.label) + '</th>').join('')
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';
}
// 全庫專利表（專利總覽）：共用 patentTableHtml，另加跨 workspace 的分頁器。
function allPatentsTableHtml(data) {
  const items = data.items || [];
  if (items.length === 0) return '<div class="hint">查無符合的專利。</div>';
  const total = data.total ?? items.length;
  const from = (data.offset ?? 0) + 1;
  const to = (data.offset ?? 0) + items.length;
  const canPrev = (data.offset ?? 0) > 0;
  const canNext = to < total;
  return patentTableHtml(data, 'overview')
    + '<div class="pager">'
    + '<button class="btn btn-outline" ' + (canPrev ? '' : 'disabled') + ' onclick="pagePatents(-1)">上一頁</button>'
    + '<span>' + from + '–' + to + ' / 共 ' + total + ' 件</span>'
    + '<button class="btn btn-outline" ' + (canNext ? '' : 'disabled') + ' onclick="pagePatents(1)">下一頁</button>'
    + '</div>';
}
// 詳情分節（2026-07-26 定案，比照專利公報版面）：長文（摘要／文獻備註）先獨立成節，
// 其餘欄位收在「書目資料」。分節只影響排列順序與節標題，欄位定義仍是 PATENT_COLUMNS
// 那一份唯一來源——此處只依 key 分組，不另立第二份欄位清單。
const DETAIL_SECTIONS = [
  { title: '摘要', keys: ['abstract', 'abstract_original', 'patent_note'] },
  // 第二節放其餘全部欄位（不列舉 key，新增欄位自動落在此節，不需同步改這裡）。
  { title: '書目資料', keys: null },
];
// 詳情：該區塊的完整欄位（含列表已顯示者），以標籤／值兩欄逐列呈現，長文字不截斷。
// 資料在列表回應中已帶回，展開不再打 API（主附圖仍走既有 lazy load 端點）。
// 詳情層版式（2026-07-27 使用者定）：**整層**左右兩欄——左＝所有文字節
// （摘要、書目資料…）逐列，右＝主附圖。原本只有書目資料節分兩欄，摘要節仍滿寬，
// 導致上下兩塊邊界不齊；且圖只在書目資料那一段旁邊，位置飄移。
function patentDetailHtml(p, scope) {
  const cols = patentColumns(scope);
  const claimed = new Set();
  DETAIL_SECTIONS.forEach(s => (s.keys || []).forEach(k => claimed.add(k)));
  const figureHtml = p.has_figure
    ? '<img loading="lazy" decoding="async" src="' + API + '/patents/'
      + encodeURIComponent(p.patent_id) + '/figure"'
      + ' alt="' + escHtml(p.patent_number || '') + ' 主附圖"'
      + ' onerror="this.outerHTML=\'<span class=&quot;figure-empty&quot;>無圖</span>\'">'
    : '<span class="figure-empty">無圖</span>';
  const sectionsHtml = DETAIL_SECTIONS.map(section => {
    const secCols = section.keys
      ? cols.filter(c => section.keys.includes(c.key))
      : cols.filter(c => !claimed.has(c.key));
    if (secCols.length === 0) return '';
    const title = '<div class="patent-detail-section">' + escHtml(section.title) + '</div>';
    // 逐列剔除兩種非文字欄：
    // - has_figure：主附圖改由整層右欄統一顯示，不在文字列裡再放一次。
    // - __exclude__：「操作」是列表上的按鈕欄，不是專利資料；排進詳情層會變成
    //   書目資料裡多一顆重複的「標不相干」鈕（2026-07-27 移欄到第一欄時發現）。
    const textCols = secCols.filter(c => c.key !== 'has_figure' && c.key !== '__exclude__');
    if (textCols.length === 0) return '';
    return title
      + '<dl class="patent-detail">'
      + textCols.map(c =>
        '<div class="patent-detail-item"><dt>' + escHtml(c.label) + '</dt>'
        + '<dd>' + patentCell(p, c, 'detail') + '</dd></div>'
      ).join('')
      + '</dl>';
  }).join('');
  // 左欄裝全部文字節、右欄固定放圖——兩者上緣對齊，下方邊界一致。
  return '<div class="patent-detail-split">'
    + '<div class="patent-detail-main">' + sectionsHtml + '</div>'
    + '<div class="patent-detail-figure">' + figureHtml + '</div>'
    + '</div>';
}

  }
  const reason = prompt('標記此專利為「不相干」並移出目前分析（不重跑分群）。\n可填理由（可留空）：', '');
  if (reason === null) return;   // 使用者取消
  try {
    const resp = await fetch(API + '/workspaces/' + encodeURIComponent(state.workspaceId)
      + '/exclude-patents', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ patent_ids: [patentId], reason: reason || null }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('剔除失敗：' + (err.detail || ('HTTP ' + resp.status)));
      return;
    }
    // 重畫分類區：被剔除者已移除當前主題 assignment，清單自動更新。
    if (state.nav === 'topics') renderTopics();
  } catch (e) {
    alert('連線錯誤：' + e.message);
  }
}
// 總覽分頁：全庫專利以 PATENTS_PAGE_SIZE 為一頁往前後翻，不一次撈全部。
function pagePatents(dir) {
  const next = state.patentsOffset + dir * PATENTS_PAGE_SIZE;
  if (next < 0) return;
  state.patentsOffset = next;
  loadAllPatents();
}

function topicTabsHtml() {

function switchTopicSource(sourceField) {

  state.topicFilterKey = null;
  state.topicPatentsOffset = 0;   // 換通道＝換一組主題，頁碼必須歸零

}
// 主題載入失敗的可讀訊息：404／無分群結果與其他錯誤分開講，不吞錯也不留白。
function topicLoadErrorHtml(e) {

  }
  return '<div class="card">主題載入失敗（' + escHtml((e && e.message) || '未知錯誤') + '）。</div>';

// 指定通道的中文名稱（技術／功效）；未知或缺值時原樣回傳。
function sourceFieldLabel(sourceField) {
  const hit = SOURCE_FIELDS.find(([v]) => v === sourceField);
  return hit ? hit[1] : (sourceField || '分類');

// 目前分頁的中文名稱（技術／功效），供提示文案使用。

}

  // 功效同時跑。按鈕狀態依「後端是否真有進行中的分群 job」推導，不靠點擊記憶——切頁會
  // clearAllTimers()＋重畫，靠記憶的狀態會遺失，回來後顯示可按的「分類」而重複建 job。

    + '<span id="topic-reselect"></span>'

    // ⚠ 全庫不提供（沿既有剔除鈕的護欄）：排除是 workspace 級，全庫是總覽本就該全收——

    + '<div id="exclusion-reviews"></div>'

    // 進階操作移到專利清單**之上**（2026-07-27 使用者定），維持 <details> 收合，

    + '<details class="topic-advanced" id="topic-advanced">'
    + '<summary>主題進階操作（AI 命名／重新命名／合併／合併歷史）</summary>'

    + '<div class="topic-ai-label-box">'

    loadTopicCandidates({ hasTopics: false });

  // 分群或 AI 命名進行中時持續盯著；結束就重畫，使用者不必手動重整（2026-07-27）。

// 分類區自動刷新：只要該 workspace 還有進行中的分群或 AI 命名 job 就每 3 秒續盯，
// 一旦兩者都結束（或本來就沒有）便重畫一次分類區——分群跑完自動出候選、
// AI 命名跑完自動把 fallback 標籤換成中文名（2026-07-27 定案：先顯示、命名完自動更新）。
// 以 registerTimer 註冊，切頁時由 clearAllTimers 自動停掉，不會殘留輪詢。
//
// 逾時 30 分鐘（2026-07-27 使用者定）：Companion 沒開時 job 會一直卡在 queued，
// 沒有上限就永遠空轉。逾時後停止輪詢並在標籤區說明，使用者可用手動鈕重試。
const TOPICS_AUTOREFRESH_TIMEOUT_MS = 30 * 60 * 1000;
let topicsAutoRefreshStartedAt = null;

function scheduleTopicsAutoRefresh() {
  const wasBusy = hasRunningClustering(state.workspaceId)
    || hasRunningTopicLabel(state.workspaceId, state.topicSourceField);
  if (!wasBusy) { topicsAutoRefreshStartedAt = null; return; }
  if (topicsAutoRefreshStartedAt === null) topicsAutoRefreshStartedAt = Date.now();
  if (Date.now() - topicsAutoRefreshStartedAt > TOPICS_AUTOREFRESH_TIMEOUT_MS) {
    topicsAutoRefreshStartedAt = null;
    showTopicsAutoRefreshTimeout();
    return;
  }
  registerTimer(async function () {
    if (state.nav !== 'topics') return;   // 已離開分類區就不再續盯
    await fetchTasks();
    const stillBusy = hasRunningClustering(state.workspaceId)
      || hasRunningTopicLabel(state.workspaceId, state.topicSourceField);
    if (stillBusy) { scheduleTopicsAutoRefresh(); return; }
    topicsAutoRefreshStartedAt = null;
    renderTopics();   // 剛結束：重畫一次，顯示新候選／新主題／AI 中文標籤
  }, 3000);
}

// 逾時提示：說明現況與可行動作，不留白讓使用者以為卡死。
function showTopicsAutoRefreshTimeout() {
  const box = el('topic-label-status');
  if (!box) return;
  box.innerHTML = '<div class="task-detail-error">'
    + '已等待 30 分鐘仍未完成。常見原因是本機 Patent Companion 沒有啟動'
    + '（AI 任務由它領取執行）。目前顯示的是系統預設標籤，可啟動 Companion 後按'
    + '「重新產生 AI 主題名稱」重試。</div>';
}

// ══════════ 分群候選挑選 → 採用（finalize） ══════════
// 目的：匯入後系統自動跑 clustering_calibrate 產生「主題候選」，但正式主題要由使用者
// 選一組候選再 finalize 才會產生。沒有這個入口，分類區會永遠是空的。
//
// 端點（皆已存在於 backend/app/api/）：
//   GET  /api/v1/clustering/candidates?workspace_id=&source_field=
//                                                    → clustering.py get_latest_candidates（後端自解析最新 run）
//   GET  /api/v1/clustering/runs/{run_id}/candidates → clustering.py get_candidates（指定 run）
//   POST /api/v1/clustering/runs/{run_id}/finalize   → clustering.py create_finalize
//   GET  /api/v1/jobs/{job_id}                       → jobs.py get_job（輪詢採用進度）
//
// run_id 取得方式：由後端解析。前端不再拉全域 /tasks 再自行過濾——/tasks 不分 workspace，
// 多 workspace 併用時舊 workspace 的 calibrate 會被擠出掃描視窗，前端便誤報「尚未跑過分群」，
// 但候選其實還在 DB 裡，使用者會被誤導去重跑一次昂貴的分群。
let candidateRunId = null;               // 目前候選來源 run_id（由候選端點回傳）
let candidateListCache = [];             // 候選原樣快取（欄位不重組，後端回什麼就留什麼）

// 候選卡上要顯示的數值指標：以「後端實際回了哪些數值欄」動態決定，不寫死指標清單。
// 這些鍵是候選物件的識別／非指標欄，顯示時排除；其餘數值欄一律顯示。
const CANDIDATE_NON_METRIC_KEYS = new Set([
  'candidate_id', 'candidate_type', 'candidate_k', 'is_selected', 'llm_explanation',
]);
// 已知指標的中文名；沒對到的鍵直接顯示原欄名（後端新增指標不必改前端）。
const CANDIDATE_METRIC_LABELS = {
  coherence: '一致性 coherence',
  diversity: '多樣性 diversity',
  balance: '均衡度 balance',
  score: '綜合分數 score',
};
// 候選類型中文名；沒對到的直接顯示原值（後端新增類型不必改前端）。
const CANDIDATE_TYPE_LABELS = {
  conservative: '保守（主題較少）',
  balanced: '平衡',
  detailed: '細分（主題較多）',
};

// 載入並呈現候選；hasTopics 為 true 時預設收合成一行入口，不擋住正常分類顯示。
// 一次呼叫即取回最新 run 與其候選（run 由後端解析），不再先掃 /tasks 找 run_id。
// 錯誤分兩類：404＝這個 workspace＋通道真的沒跑過分群；其餘＝查詢失敗（可重試）。
async function loadTopicCandidates(opts) {
  const wrap = el('topic-candidates');
  if (!wrap) return;
  const hasTopics = !!(opts && opts.hasTopics);
  // 標題列的重新挑選鈕每次重畫都先清空，只有下面那個分支會填回去——
  // 否則點開挑選介面後，上方仍留著一顆已失效的入口鈕。
  const reselectSlot = el('topic-reselect');
  if (reselectSlot) reselectSlot.innerHTML = '';
  // 已有正式主題且使用者沒有點開重新挑選：只放入口，不打候選 API（省一次往返）。
  if (hasTopics && !state.candidatePickerOpen) {
    // 已採用分類：入口鈕移到上方標題列（2026-07-27 一列橫排），此處不再另起一行。
    wrap.innerHTML = '';
    const slot = el('topic-reselect');
    if (slot) {
      slot.innerHTML = '<button class="btn btn-outline" onclick="openCandidatePicker()">'
        + '重新挑選分類</button>';
    }
    return;
  }
  wrap.innerHTML = '<div class="hint">載入分群候選中…</div>';
  const retryBtn = '<button class="btn btn-outline" style="margin-left:0.6rem" onclick="reloadTopicCandidates('
    + (hasTopics ? 'true' : 'false') + ')">重試</button>';
  try {
    const data = await getJson(API + '/clustering/candidates?workspace_id='
      + encodeURIComponent(state.workspaceId)
      + '&source_field=' + encodeURIComponent(state.topicSourceField));
    candidateRunId = data.run_id;
    candidateListCache = data.candidates || [];
    renderCandidatePicker(data, hasTopics);
  } catch (e) {
    candidateRunId = null;
    candidateListCache = [];
    if (e.status === 404) {
      // 真的沒跑過分群：明確講「尚未分群」，不要讓使用者以為是系統壞掉。
      wrap.innerHTML = hasTopics
        ? candidatePickerCloseHtml('此 workspace 的' + currentSourceLabel()
          + '通道尚未分群，沒有可挑選的候選。')
        : '<div class="card">此 workspace 的' + escHtml(currentSourceLabel())
          // 分群自 2026-07-26 起改為手動觸發，匯入不再自動分群；文案同步更正。
          + '通道尚未分群。請按上方「分類」開始分群，完成後候選會出現在這裡。</div>';
      return;
    }
    // 其他狀況一律是查詢失敗（連線／伺服器錯誤），保留狀態碼並提供重試，
    // 不得說成「沒跑過分群」——候選可能好好躺在 DB 裡。
    wrap.innerHTML = '<div class="card">查詢分群候選失敗（' + escHtml(e.message) + '）。'
      + retryBtn + '</div>';
  }
}
function reloadTopicCandidates(hasTopics) { loadTopicCandidates({ hasTopics: hasTopics }); }
// 已有主題時的「關閉重新挑選」列（附帶一段說明文字）。
function candidatePickerCloseHtml(msg) {
  return '<div class="card">' + escHtml(msg)
    + '<button class="btn btn-outline" style="margin-left:0.6rem" onclick="closeCandidatePicker()">'
    + '回到目前分類</button></div>';
}
function openCandidatePicker() {
  state.candidatePickerOpen = true;
  state.candidatePickId = null;
  loadTopicCandidates({ hasTopics: true });
}
function closeCandidatePicker() {
  state.candidatePickerOpen = false;
  state.candidatePickId = null;

// 候選卡清單：後端回幾組就畫幾組；指標欄由回傳內容決定，不假設固定三組或固定指標。
function renderCandidatePicker(data, hasTopics) {
  const wrap = el('topic-candidates');
  if (!wrap) return;
  const list = data.candidates || [];
  if (list.length === 0) {
    wrap.innerHTML = hasTopics
      ? candidatePickerCloseHtml('此分群結果（run #' + candidateRunId + '）沒有可挑選的候選。')
      : '<div class="card">此分群結果（run #' + escHtml(candidateRunId)
        + '）沒有可挑選的候選，請重新執行分群。</div>';
    return;
  }
  // 預設選取：後端已標 is_selected 的那組（重新挑選時對應目前採用的），否則不預選。
  if (state.candidatePickId === null) {
    const marked = list.find(c => c.is_selected);
    if (marked) state.candidatePickId = marked.candidate_id;
  }
  const cards = list.map(c => candidateCardHtml(c)).join('');
  // 分群自身狀態；finalize 只放行 needs_review／failed（見後端同一組守門）。
  const finalized = data.clustering_status === 'completed';
  wrap.innerHTML = '<div class="card">'
    + '<div style="font-weight:600;margin-bottom:0.3rem">挑選分類方式（'
    + escHtml(currentSourceLabel()) + '通道，run #' + escHtml(data.run_id) + '）</div>'
    + '<p class="hint" style="padding:0 0 0.2rem">'
    + (finalized
        ? '此 run 已採用下方標示「（目前採用中）」的分類。'
          + '想改用其他主題數，點選另一組候選後按「改用這組分類」即可，不必重跑分類。'
        : '系統已算出下列分類候選，各組主題數與指標不同。'
          + '選一組後按「採用這組分類」，系統會據此建立正式主題。')
    + '</p>'
    + '<div class="cand-list">' + cards + '</div>'
    + '<div class="toolbar">'
    // 2026-07-28：已定案的 run 也能再送 finalize（改選候選）。原本鈕停用並叫使用者
    // 「按分類重跑一次」——那條路實際走 incremental，沒有新資料時等於空跑，
    // artifact 遺失時更直接 FileNotFoundError，是承諾了做不到的操作。
    // 選中的就是目前採用中那組時，鈕維持停用（沒有可改的東西）。
    + (finalized && !candidatePickIsDifferent()
        ? '<button class="btn btn-primary" disabled>已採用此分類</button>'
          + '<span class="hint" style="padding:0 0 0 .6rem">'
          + '點選其他組候選即可改用。</span>'
        : '<button class="btn btn-primary" id="btn-finalize-candidate"'
          + ' onclick="submitFinalizeCandidate()">'
          + (finalized ? '改用這組分類' : '採用這組分類') + '</button>')
    + (hasTopics ? '<button class="btn btn-outline" onclick="closeCandidatePicker()">取消</button>' : '')
    + '</div>'
    + '<div id="candidate-finalize-job"></div>'
    + '</div>';
}
// 單張候選卡：主題數用 candidate_k；其餘數值欄一律當指標列出（欄名不寫死）。
function candidateCardHtml(c) {
  const typeLabel = CANDIDATE_TYPE_LABELS[c.candidate_type] || c.candidate_type || '候選';
  const metrics = Object.keys(c)
    .filter(k => !CANDIDATE_NON_METRIC_KEYS.has(k) && typeof c[k] === 'number')
    .map(k => '<div><span class="m-name">' + escHtml(CANDIDATE_METRIC_LABELS[k] || k)
      + '</span>' + formatCandidateMetric(c[k]) + '</div>')
    .join('');
  const sel = state.candidatePickId === c.candidate_id ? ' selected' : '';
  return '<div class="cand-card' + sel + '" onclick="pickCandidate(' + escHtml(c.candidate_id) + ')">'
    + '<div class="cand-card-title"><span>' + escHtml(typeLabel) + '</span>'
    + '<span>' + escHtml(c.candidate_k) + ' 個主題</span></div>'
    + '<div class="cand-metrics">' + (metrics || '<div>（此候選未附指標）</div>') + '</div>'
    + (c.llm_explanation ? '<div class="cand-explain">' + escHtml(c.llm_explanation) + '</div>' : '')
    + (c.is_selected ? '<div class="cand-explain">（目前採用中）</div>' : '')
    + '</div>';
}
// 指標數值顯示：整數原樣、小數取四位，不硬綁特定欄位的位數。
function formatCandidateMetric(v) {
  return Number.isInteger(v) ? String(v) : v.toFixed(4);
}
// 目前點選的候選是否「不同於採用中的那組」——決定鈕要不要放行（2026-07-28）。
function candidatePickIsDifferent() {
  const current = (candidateListCache || []).find(c => c.is_selected);
  if (!current) return true;   // 還沒定案，任何選擇都算有效
  return state.candidatePickId !== current.candidate_id;
}

function pickCandidate(candidateId) {
  state.candidatePickId = candidateId;
  // 只重畫候選卡的選取狀態，不重打 API。
  const list = candidateListCache;
  const wrap = document.querySelector('#topic-candidates .cand-list');
  if (wrap) wrap.innerHTML = list.map(c => candidateCardHtml(c)).join('');
  // 已定案時，鈕的可按狀態隨選擇變動（選回採用中那組就該停用），故一併重畫工具列。
  renderCandidateToolbar();
}

// 工具列單獨重畫：pickCandidate 後只更新鈕，不重打 API、不重畫整張卡片區。
function renderCandidateToolbar() {
