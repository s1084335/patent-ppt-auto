// ══════════ 輸出 PPT（預覽閘門後送 ai:report_ppt → 回流 → 下載連結） ══════════
// 分工：AI 只產各頁確認槽文案 → CLI 順手呼 deterministic build_ppt.py 組版 →
// .pptx 進 report_artifacts → 打下載路由取回。與單頁 HTML 匯出並存（兩種都給）。
// ⚠ 預覽閘門不跳過：必須先有預覽內容（exportPreview.content）＝使用者已預覽，才送。
// ⚠ workspace_id 放進 params（to_payload 會 exclude 具名 workspace_id）；報表版本以
//    based_on_version 帶入（runner 據以解析報表版本目錄）。
// 重抓目前匯出版本的 content 並寫回快取。
// ⚠ 「要不要先跑 narrative」是會花 8 分鐘與一次 AI 額度的決策，不能建立在
//   可能過期的快取上（2026-07-31 實機 #149：#148 兩分半鐘前才產完解讀，
//   匯出頁快取仍停在「解讀還沒產」那一刻，於是又跑了一次整份重產）。
//   content 端點已於本日修為 ~1 秒，決策前重抓一次成本可忽略。
// 重抓失敗時回舊快取，不阻斷產 PPT——判斷失準的代價小於整條路斷掉。
async function refreshExportContent() {
  const version = exportPreview.version
    || (exportPreview.content && exportPreview.content.version);
  if (!version) return exportPreview.content;
  try {
    const content = await getJson(
      API + '/reports/versions/' + encodeURIComponent(version) + '/content');
    exportPreview.content = content;
    return content;
  } catch (e) {
    return exportPreview.content;
  }
}

function exportReportHasNarratives(content) {
  content = content || exportPreview.content;
  const sections = (content && content.sections) || [];
  return sections.some(section =>
    (section.variants || []).some(variant => narrativeAiOriginal(variant)));
}

async function runNarrativeThenExportPpt() {
  const wrap = el('export-ppt-result');
  const content = exportPreview.content;
  const version = content && content.version;
  if (!version) { alert('請先載入報表版本。'); return; }
  if (narrativeJobRunning(version)) {
    if (wrap) wrap.innerHTML = '<div class="hint">AI 解讀任務已在執行中；完成後會接續產生 PPT。</div>';
    return;
  }
  try {
    const created = await getJson(API + '/ai-tasks', {
      method: 'POST',
      headers: aiAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ task_type: 'ai:narrative', based_on_version: version }),
    });
    if (wrap) wrap.innerHTML = '<div class="hint">尚無 AI 解讀，已先送出 narrative 任務（run '
      + escHtml(created.run_id) + '）；成功後會接續產生 PPT。</div>';
    await fetchTasks();
    pollNarrativeThenExportPpt(created.run_id);
  } catch (e) {
    if (wrap) wrap.innerHTML = '<div class="card">啟動 narrative 失敗（' + escHtml(e.message) + '）。</div>';
  }
}

async function pollNarrativeThenExportPpt(runId) {
  const wrap = el('export-ppt-result');
  async function tick() {
    if (state.nav !== 'export') return;
    try {
      const t = await getJson(API + '/ai-tasks/' + runId, { headers: aiAuthHeaders() });
      if (t.status === 'succeeded') {
        if (wrap) wrap.innerHTML = '<div class="hint">AI 解讀完成，接續產生 PPT…</div>';
        if (exportPreview.version) await loadExportPreview(exportPreview.version);
        await requestExportPpt({ skipNarrativeCheck: true });
        return;
      }
      if (['failed', 'cancelled'].includes(t.status)) {
        if (wrap) wrap.innerHTML = '<div class="card">AI 解讀 ' + escHtml(t.status)
          + '（' + escHtml(t.error_message || '無錯誤訊息') + '）。PPT 未送出。</div>';
        return;
      }
      if (wrap) wrap.innerHTML = '<div class="hint">AI 解讀 #' + escHtml(runId) + ' '
        + escHtml(t.status) + '　' + escHtml(t.current_stage || '') + '</div>';
    } catch (e) {
      if (wrap) wrap.innerHTML = '<div class="hint">查詢 narrative 任務失敗（' + escHtml(e.message) + '）。</div>';
      return;
    }
    registerTimer(tick, 3000);
  }
  tick();
}

async function requestExportPpt(options) {
  options = options || {};
  const wrap = el('export-ppt-result');
  if (!exportPreview.content) { alert('請先於下方預覽報告內容，再輸出 PPT。'); return; }
  if (!options.skipNarrativeCheck) {
    // 依即時資料判斷，不看快取（見 refreshExportContent 的說明）。
    const fresh = await refreshExportContent();
    if (!exportReportHasNarratives(fresh)) {
      await runNarrativeThenExportPpt();
      return;
    }
  }
  const btn = el('btn-export-ppt');
  if (btn) { btn.disabled = true; btn.textContent = '送出中…'; }
  try {
    // ⚠ 三種人工覆寫**只走 approval_overrides 一包**（派工端 _run_ai_report_ppt_job
    // 只讀這個 key）。曾同時在頂層又送 slots／layout_overrides／position_overrides，
    // 派工端不讀＝死參數，徒留「看起來有傳」的誤導（2026-07-29 移除）。
    const params = {
      based_on_version: exportPreview.content.version,
      approval_overrides: exportPptApprovalOverrides(),
    };
    if (state.workspaceId) params.workspace_id = state.workspaceId;
    const created = await getJson(API + '/ai-tasks', {
      method: 'POST',
      headers: aiAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ task_type: 'ai:report_ppt', params: params }),
    });
    if (wrap) wrap.innerHTML = '<div class="hint">已送出輸出 PPT 任務（run '
      + escHtml(created.run_id) + '）；完成後於此顯示下載連結。</div>';
    pollExportPptJob(created.run_id);
  } catch (e) {
    if (wrap) wrap.innerHTML = '<div class="card">輸出 PPT 失敗（' + escHtml(e.message) + '）。</div>';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '產生 PPT'; }
  }
}
// 輪詢 PPT 任務（GET /ai-tasks/{run_id}）；SSE 回流時 updateTaskFromEvent 也會推進，
// 這裡的輪詢是保底。完成後從 result.pptx_filename 組下載連結（打 /report-latest/ppt 路由）。
async function pollExportPptJob(runId) {
  const wrap = el('export-ppt-result');
  if (!wrap) return;
  async function tick() {
    if (state.nav !== 'export') return;
    try {
      const t = await getJson(API + '/ai-tasks/' + runId, { headers: aiAuthHeaders() });
      if (t.status === 'succeeded') {
        const r = t.result || {};
        const version = r.based_on_version || (exportPreview.content && exportPreview.content.version);
        const filename = r.pptx_filename;
        if (version && filename) {
          const url = API + '/report-latest/ppt/' + encodeURIComponent(version)
            + '/' + encodeURIComponent(filename);
          wrap.innerHTML = '<div class="card"><strong>PPT 已產出</strong>'
            + '<div class="export-edit-actions" style="margin-top:0.6rem">'
            + '<a class="btn btn-primary" href="' + url + '" download="' + escHtml(filename) + '">下載 PPT</a>'
            + '</div>'
            + '<p class="hint" style="padding:0.4rem 0 0">已填文案 '
            + escHtml(r.slots_filled) + '／' + escHtml(r.slots_total) + ' 槽；未填槽於該頁標「待確認」浮水印。</p>'
            + '</div>';
          await loadExportPptFiles(version);
        } else {
          wrap.innerHTML = '<div class="hint">PPT 任務完成，但未回報檔名。</div>';
        }
        return;
      }
      if (['failed', 'cancelled'].includes(t.status)) {
        wrap.innerHTML = '<div class="card">輸出 PPT ' + escHtml(t.status)
          + '（' + escHtml(t.error_message || '無錯誤訊息') + '）。</div>';
        return;
      }
      wrap.innerHTML = '<div class="hint">輸出 PPT #' + escHtml(runId) + ' '
        + escHtml(t.status) + '　' + escHtml(t.current_stage || '') + '</div>';
    } catch (e) {
      wrap.innerHTML = '<div class="hint">查詢 PPT 任務失敗（' + escHtml(e.message) + '）。</div>';
      return;
    }
    registerTimer(tick, 3000);
  }
  tick();
}

async function createComparison() {
  const title = el('comp-case-title').value.trim();
  const text = el('comp-case-text').value.trim();
  if (!title || !text) { alert('請輸入案件名稱與文字。'); return; }
  const wsId = state.workspaceId || 1;
  try {
    const resp = await fetch(API + '/comparisons', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workspace_id: wsId, case_title: title, case_text: text,
        comparison_type: 'claim_or_technical',
        idempotency_key: 'fe-' + Date.now(),
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('建立比對失敗：' + (err.detail || resp.status));
      return;
    }
    const job = await resp.json();
    state.comparison.jobId = job.job_id;
    updateComparisonJobInfo(job);
  } catch (e) { alert('連線錯誤：' + e.message); }
}

function updateComparisonJobInfo(job) {
  setText('comp-job-id', job.job_id);
  setText('comp-job-status', job.status);
  setText('comp-current-stage', job.current_stage);
  const pct = job.progress_percent ?? 0;
  setText('comp-progress-percent', pct + '%');
  const bar = el('comp-progress-bar');
  if (bar) bar.style.width = pct + '%';
}

async function saveTarget() {
  const jobId = state.comparison.jobId;
  if (!jobId) { alert('請先建立比對案件。'); return; }
  try {
    const resp = await fetch(API + '/comparisons/' + jobId + '/target', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        target_type: el('comp-target-type').value,
        title: el('comp-target-title').value.trim(),
        description: el('comp-target-description').value.trim(),
        simulated: el('comp-target-simulated').checked,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('儲存標的失敗：' + (err.detail || resp.status));
      return;
    }
    const data = await resp.json();
    setText('comp-version-target', data.version);
  } catch (e) { alert('連線錯誤：' + e.message); }
}

async function saveUnderstanding() {
  const jobId = state.comparison.jobId;
  if (!jobId) { alert('請先建立比對案件。'); return; }
  const rawFeatures = (el('comp-understanding-features').value || '');
  const rawAssumptions = (el('comp-understanding-assumptions').value || '');
  const features = rawFeatures.split('\n').filter(s => s.trim());
  const assumptions = rawAssumptions.split('\n').filter(s => s.trim());
  try {
    const resp = await fetch(API + '/comparisons/' + jobId + '/understanding', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        features: features,
        assumptions: assumptions,
        source: el('comp-understanding-source').value,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('儲存理解稿失敗：' + (err.detail || resp.status));
      return;
    }
    const data = await resp.json();
    state.comparison.understandingVersion = data.version;
    setText('comp-version-understanding', data.version);
  } catch (e) { alert('連線錯誤：' + e.message); }
}

async function approveUnderstanding() {
  const jobId = state.comparison.jobId;
  if (!jobId) { alert('請先建立比對案件。'); return; }
  const version = state.comparison.understandingVersion;
  if (!version) { alert('請先儲存理解稿。'); return; }
  const approvedBy = el('comp-approved-by').value.trim();
  if (!approvedBy) { alert('請輸入核准者名稱。'); return; }
  try {
    const resp = await fetch(API + '/comparisons/' + jobId + '/understanding/approve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        understanding_version: version,
        approved_by: approvedBy,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('核准失敗：' + (err.detail || resp.status));
      return;
    }
    const data = await resp.json();
    setText('comp-version-approval', data.version);
  } catch (e) { alert('連線錯誤：' + e.message); }
}

async function loadComparisonState() {
  const jobId = parseInt(el('comp-load-job-id').value.trim(), 10) || state.comparison.jobId;
  if (!jobId) { alert('請輸入 Job ID。'); return; }
  try {
    const data = await getJson(API + '/comparisons/' + jobId);
    fillComparisonFromResponse(data);
    state.comparison.jobId = jobId;
    el('comp-load-job-id').value = jobId;
  } catch (e) { alert('載入失敗：' + e.message); }
}

function fillComparisonFromResponse(data) {
  setText('comp-job-id', data.job_id);
  setText('comp-job-status', data.status);
  setText('comp-current-stage', data.current_stage);
  const pct = data.progress_percent ?? 0;
  setText('comp-progress-percent', pct + '%');
  const bar = el('comp-progress-bar');
  if (bar) bar.style.width = pct + '%';
  // 回填 outputs
  const result = data.result || {};
  if (result.target_version) setText('comp-version-target', result.target_version);
  if (result.understanding_version) setText('comp-version-understanding', result.understanding_version);
  if (result.approval_version) setText('comp-version-approval', result.approval_version);
  // 回填 element_analysis
  if (data.element_analysis_version != null) {
    setText('comp-version-element-analysis', data.element_analysis_version);
  }
  if (data.element_analysis) {
    el('comp-element-analysis-json').value = JSON.stringify(data.element_analysis, null, 2);
  }
}

async function saveElementAnalysis() {
  const jobId = state.comparison.jobId;
  if (!jobId) { alert('請先建立比對案件。'); return; }
  const raw = el('comp-element-analysis-json').value.trim();
  if (!raw) { alert('請輸入要素比對 JSON。'); return; }

  try { payload = JSON.parse(raw); } catch (_) { alert('JSON 格式無效。'); return; }
  try {
    const resp = await fetch(API + '/comparisons/' + jobId + '/element-analysis', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },

    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert('儲存要素比對失敗：' + (err.detail || resp.status));
      return;
    }
    const data = await resp.json();
    setText('comp-version-element-analysis', data.version);
  } catch (e) { alert('連線錯誤：' + e.message); }

// ══════════ 右欄 AI 助手：任務列表 + SSE + enqueue ══════════
// 顯示邏輯（decisions.md「長時任務前端進度顯示」）：succeeded 不顯示（完成即從列表過濾），
// queued/running/failed/cancelled 保留；running/queued 點卡看「在做哪裡」（current_stage＋進度），
// failed 點卡看錯誤原因（job.error_message）。詳情用狀態欄位判斷，不寫死特定 job_id。
// 已完成任務保留顯示的筆數（2026-07-27 使用者定案：切頁後仍看得到剛跑完的 job）。
// 原本 succeeded 一律過濾，導致切換頁面重抓後「剛完成的任務」整個消失、看不到結果。
// 改為：進行中／失敗全留，succeeded 保留最近 RECENT_DONE_KEEP 筆（依 job_id 新→舊）。
const RECENT_DONE_KEEP = 5;
const HIDDEN_TASK_STATUSES = new Set(['succeeded']);  // 仍用於 SSE 即時事件的降級判斷
let taskById = {};  // job_id -> 任務物件，供點擊展開詳情查閱 error_message／stage
function isHiddenTask(t) { return HIDDEN_TASK_STATUSES.has(t.status); }
function taskCardHtml(t) {
  const statusCls = 'status-' + (t.status || 'queued');
  const pct = t.progress_percent ?? 0;
  const stage = t.current_stage || '';
  // 任一狀態都可點開詳情；failed 看原因、running/queued 看階段與進度。
  return '<div class="task-card task-clickable" data-run-id="' + t.job_id + '"'
    + ' onclick="toggleTaskDetail(' + t.job_id + ')" title="點擊查看詳情">'
    + '<div class="task-card-header">'
    + '<span class="task-type">' + escHtml(t.job_type) + ' #' + escHtml(t.job_id) + '</span>'
    + '<span class="task-status ' + statusCls + '">' + escHtml(t.status) + '</span>'
    + '</div>'
    + '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="task-meta"><span>' + escHtml(stage) + '</span><span class="elapsed"></span></div>'
    + '<div class="task-detail" data-detail-for="' + t.job_id + '" style="display:none"></div>'
    + '</div>';
}
// 點卡展開／收合詳情：failed 顯示 error_message，其餘顯示目前階段與進度。
function toggleTaskDetail(runId) {
  const box = document.querySelector('.task-detail[data-detail-for="' + runId + '"]');
  if (!box) return;
  if (box.style.display !== 'none') { box.style.display = 'none'; return; }
  const t = taskById[runId] || {};
  let html;
  if (t.status === 'failed' || t.status === 'cancelled') {
    const reason = t.error_message || '（無錯誤訊息）';
    html = '<div class="task-detail-title">失敗原因</div>'
      + '<div class="task-detail-error">' + escHtml(reason) + '</div>';
  } else {
    html = '<div class="task-detail-title">目前進度</div>'
      + '<div>階段：' + escHtml(t.current_stage || '—')
      + '　進度：' + (t.progress_percent ?? 0) + '%</div>';
  }
  box.innerHTML = html;
  box.style.display = 'block';
}
// 最近一次 /tasks 的結果快取。分類區據此推導「分類中／命名中」——
// 按鈕狀態必須以後端真實 job 為準，不能靠「這次點擊」的記憶：
// 切頁會 clearAllTimers()＋重畫，靠記憶的狀態一律遺失（2026-07-27 使用者回報）。
let taskListCache = [];

// 該 workspace 是否有進行中的分群 job（queued/running）。
// 用於：切頁回來、F5 後，按鈕仍正確顯示「分類中…」。
function hasRunningClustering(workspaceId) {
  if (workspaceId === null || workspaceId === undefined) return false;
  return taskListCache.some(t =>
    (t.job_type === 'clustering_calibrate' || t.job_type === 'clustering_incremental'
      || t.job_type === 'embeddings')
    && ['queued', 'running'].includes(t.status)
    // embeddings 為全域前置（不帶 workspace_id），仍視為分類流程的一部分
    && (t.job_type === 'embeddings' || t.workspace_id === workspaceId));
}

// 該 workspace＋通道是否有進行中的 AI 主題命名 job。
// finalize 後自動排（handlers._enqueue_topic_label），命名完成前顯示 fallback 標籤。
function hasRunningTopicLabel(workspaceId, sourceField) {
  return taskListCache.some(t =>
    t.job_type === 'ai:topic_label'
    && ['queued', 'running'].includes(t.status)
    && t.workspace_id === workspaceId
    && (!sourceField || !t.payload || t.payload.source_field === sourceField));
}

// 該 workspace 是否有進行中（queued/running）的指定 job。
// 手動觸發鈕的停用狀態一律以**後端真實 job** 推導，不靠「這次點擊」的記憶——
// 切頁會 clearAllTimers()＋重畫，靠記憶的狀態一律遺失（2026-07-27 使用者回報）。
function hasRunningJob(jobType, workspaceId) {
  if (workspaceId === null || workspaceId === undefined) return false;
  return taskListCache.some(t =>
    t.job_type === jobType
    && ['queued', 'running'].includes(t.status)
    && t.workspace_id === workspaceId);
}
function hasRunningIrrelevantFilter(workspaceId) {
  return hasRunningJob('ai:irrelevant_filter', workspaceId);
}

function renderTaskList(tasks) {
  const c = el('task-container');
  if (!c) return;
  taskListCache = tasks || [];
  maybeRefreshReportNarratives(taskListCache);
  // 進行中／失敗全留；succeeded 只留最近 RECENT_DONE_KEEP 筆（依 job_id 新→舊），
  // 讓使用者切頁回來仍看得到剛跑完的任務結果，而非整批消失（2026-07-27）。
  const all = tasks || [];
  const active = all.filter(t => !isHiddenTask(t));
  const done = all.filter(isHiddenTask)
    .sort((a, b) => (b.job_id || 0) - (a.job_id || 0))
    .slice(0, RECENT_DONE_KEEP);
  const visible = active.concat(done);
  taskById = {};
  all.forEach(t => { taskById[t.job_id] = t; });
  if (visible.length === 0) { c.innerHTML = '<div class="task-empty">尚無進行中或待處理任務</div>'; return; }
  c.innerHTML = visible.map(taskCardHtml).join('');
}

// 匯出頁快取已依哪個 narrative job 刷新過（避免輪詢期間重覆重抓）。
let lastExportNarrativeReloadJobId = 0;

async function maybeRefreshReportNarratives(tasks) {
  const succeeded = (tasks || [])
    .filter(t => t.job_type === 'ai:narrative' && t.status === 'succeeded');
  // 匯出頁快取同步（2026-07-31）：原本只刷報表種類頁的 #report-inline-view，
  // 匯出頁的 exportPreview.content 永遠停在載入當下——顯示與判斷都會用到舊狀態。
  if (exportPreview.version) {
    const mine = succeeded
      .filter(t => t.payload && t.payload.based_on_version === exportPreview.version)
      .sort((a, b) => (b.job_id || 0) - (a.job_id || 0));
    const newest = mine.length ? (mine[0].job_id || 0) : 0;
    if (newest > lastExportNarrativeReloadJobId) {
      lastExportNarrativeReloadJobId = newest;   // 每個 job 只刷一次，不隨輪詢重打
      await refreshExportContent();
    }
  }
  if (state.nav !== 'reports' || !reportViewContent || !reportViewContent.version) return;
  const done = succeeded
    .filter(t => t.payload && t.payload.based_on_version === reportViewContent.version)
    .sort((a, b) => (b.job_id || 0) - (a.job_id || 0));
  if (!done.length) return;
  const newestId = done[0].job_id || 0;
  if (newestId <= lastNarrativeReloadJobId) return;
  lastNarrativeReloadJobId = newestId;
  await reloadCurrentReportContentOnly();
}

async function reloadCurrentReportContentOnly() {
  const wrap = el('report-inline-view');
  if (!wrap || !reportViewContent) return;
  const selected = el('report-view-select');
  const selectedValue = selected ? selected.value : null;
  try {
    const resp = await fetch(API + '/report-latest/content');
    if (!resp.ok) return;
    const content = await resp.json();
    reportViewContent = content;
    fillReportViewSelect(content);
    const sel = el('report-view-select');
    if (sel && selectedValue !== null && Array.from(sel.options).some(o => o.value === selectedValue)) {
      sel.value = selectedValue;
      renderReportViewer();
    }
  } catch (_) {
    // 任務列表刷新不應打斷使用者操作；下一次手動切換或重整仍會重新取 content。
  }
}
// SSE 進度事件即時更新對應卡片（progress/status/stage）；轉為 succeeded 時整卡移除。
function updateTaskFromEvent(ev) {
  const cached = taskById[ev.run_id];
  if (cached) {
    if (ev.status) cached.status = ev.status;
    if (ev.stage) cached.current_stage = ev.stage;
    const p = ev.progress ?? ev.progress_percent;
    if (p !== undefined && p !== null) cached.progress_percent = p;
    if (ev.error_message !== undefined) cached.error_message = ev.error_message;
  }
  const card = document.querySelector('.task-card[data-run-id="' + ev.run_id + '"]');
  // succeeded 不再立刻移除卡片（2026-07-27）：改重抓清單，由 renderTaskList 依
  // 「最近完成保留 N 筆」規則決定去留，使用者才看得到剛跑完的結果。
  if (ev.status && HIDDEN_TASK_STATUSES.has(ev.status)) { fetchTasks(); return; }
  if (!card) { fetchTasks(); return; }
  const pct = ev.progress ?? ev.progress_percent ?? 0;
  const fill = card.querySelector('.progress-bar-fill');
  if (fill) fill.style.width = pct + '%';
  const st = card.querySelector('.task-status');
  if (st && ev.status) { st.textContent = ev.status; st.className = 'task-status status-' + ev.status; }
  const meta = card.querySelectorAll('.task-meta span');
  if (meta.length > 0 && ev.stage) meta[0].textContent = ev.stage;
}
async function fetchTasks() {
  try {
    const data = await getJson(API + '/tasks?limit=20');
    renderTaskList(data.tasks);
  } catch (e) { /* 靜默：狀態頁另有系統狀態顯示 */ }
}
// sendAiRequest 已移除（2026-07-29 使用者定案「只拿掉輸入框，解讀照樣自動產」，
// AI 助手欄「單純任務進度表就好」）。它與報表區 runNarrative 是同一件事
// （建 ai:narrative job）的第二個入口，且側欄打的需求會套用到**整份**報表；
// 改由各報表旁的「重產解讀」帶 report_keys，在哪張報表提的需求就只重產那張。
async function pollAiTask(runId) {
  const wrap = el('ai-task-result');
  if (!wrap) return;
  wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">AI 任務 #' + escHtml(runId) + ' 執行中…</div>';
  async function tick() {
    try {
      const t = await getJson(API + '/ai-tasks/' + runId, { headers: aiAuthHeaders() });
      if (t.status === 'succeeded') { renderAiTaskResult(t); return; }
      if (['failed', 'cancelled'].includes(t.status)) { renderAiTaskResult(t); return; }
      wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">AI 任務 #' + escHtml(runId)
        + ' ' + escHtml(t.status) + '　' + escHtml(t.current_stage || '') + '</div>';
    } catch (e) {
      wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">查詢 AI 任務失敗（' + escHtml(e.message) + '）。</div>';
      return;
    }
    registerTimer(tick, 3000);
  }
  tick();
}
// 顯示 AI 產出：result 為 dict（欄名依任務型別而異），逐鍵列出文字內容；過長由 CSS 捲動。
// 失敗時顯示 error_message（沿用既有欄名）。
function renderAiTaskResult(t) {
  const wrap = el('ai-task-result');
  if (!wrap) return;
  if (t.status !== 'succeeded') {
    wrap.innerHTML = '<div class="ai-result-card"><div class="task-detail-title">AI 任務 #'
      + escHtml(t.run_id) + ' ' + escHtml(t.status) + '</div>'
      + '<div class="ai-result-body task-detail-error">' + escHtml(t.error_message || '（無錯誤訊息）') + '</div></div>';
    return;
  }
  const result = t.result;
  if (!result || Object.keys(result).length === 0) {
    wrap.innerHTML = '<div class="hint" style="padding:0.4rem 0">AI 任務 #' + escHtml(t.run_id) + ' 完成，但無產出內容。</div>';
    return;
  }
  // 欄名不寫死：把 result 各鍵當作段落標題逐一顯示，物件型別轉 JSON 呈現。
  const sections = Object.keys(result).map(k =>
    '<details class="ai-result-card" open>'
    + '<summary>' + escHtml(k) + '</summary>'
    + '<div class="ai-result-body">' + escHtml(aiResultText(result[k])) + '</div>'
    + '</details>'
  ).join('');
  wrap.innerHTML = '<div class="task-detail-title">AI 任務 #' + escHtml(t.run_id) + ' 產出</div>' + sections;
}
function aiResultText(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v, null, 2); } catch (_) { return String(v); }
}

// ══════════ SSE 訂閱（斷線退化 30 秒輪詢） ══════════
let sse = null;
let ssePollTimer = null;
function connectSSE() {
  if (sse) sse.close();
  try { sse = new EventSource(API + '/events'); }
  catch (_) { startPollFallback(); return; }
  sse.onmessage = function (e) {
    try {
      const ev = JSON.parse(e.data);
      if (ev.kind === 'run') updateTaskFromEvent(ev);
    } catch (_) {}
  };
  sse.addEventListener('heartbeat', function () {});
  sse.onopen = function () {
    if (ssePollTimer) { clearInterval(ssePollTimer); ssePollTimer = null; }
  };
  sse.onerror = function () {
    if (sse) { sse.close(); sse = null; }
    startPollFallback();
  };
}
function startPollFallback() {
  if (!ssePollTimer) {
    ssePollTimer = setInterval(fetchTasks, 30000);  // 斷線退化：30 秒輪詢保底
  }
}

// ══════════ 匯入專利資料（頂列匯入鈕 → 對話框 → POST /imports → 輪詢 /jobs） ══════════
// workspace 二選一（新建 / 加入既有）互斥，對齊後端 create_import 的 workspace_id 與
// new_workspace_name 互斥參數；用途對齊 IMPORT_PURPOSES（general／case_comparison）。
// 上傳以檔案原始內容作 raw body 送出（沿 imports API 的串流語意，不打包 multipart）。
function openImportDialog() {
  resetImportDialog();
  populateImportWorkspaces();
  const ov = el('import-overlay');
  if (ov) ov.hidden = false;
}
function closeImportDialog() {
  const ov = el('import-overlay');
  if (ov) ov.hidden = true;
  clearTimer(importTimerId); importTimerId = null;
}
// 重置對話框：清錯誤與檔案選擇，恢復按鈕與模式。
// （進度／結果已移到右欄 #import-progress-panel，不在對話框內，故不在此清）
function resetImportDialog() {
  showImportError('');
  const f = el('import-file'); if (f) f.value = '';
  const btn = el('btn-start-import');
  if (btn) { btn.disabled = false; btn.textContent = '開始匯入'; }
  const modeNew = el('import-ws-mode-new'); if (modeNew) modeNew.checked = true;
  onImportWsModeChange();
}
// ── 匯入選擇讀取：送出時直接讀當下真實表單（檔案／workspace 二選一／用途），不寫死。──
// 讀取檔案／workspace 二選一／用途，皆讀當下真實選擇；缺漏回 error 讓呼叫端顯示。
function collectImportChoice() {
  const fileInput = el('import-file');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) return { error: '請先選擇要匯入的檔案。' };
  const mode = importWsMode();
  const purposeSel = el('import-purpose');
  const purposeValue = purposeSel ? purposeSel.value : 'general';
  const choice = { file: file, mode: mode, purposeValue: purposeValue };
  if (mode === 'new') {
    const name = (el('import-new-ws-name').value || '').trim();
    if (!name) return { error: '請輸入新 workspace 名稱。' };
    choice.newWorkspaceName = name;
  } else {
    const sel = el('import-existing-ws');
    const wsId = sel ? sel.value : '';
    if (!wsId) return { error: '請選擇要加入的既有 workspace。' };
    choice.workspaceId = wsId;
  }
  return { choice: choice };
}
// 二選一互斥：new 模式啟用名稱輸入、停用既有下拉；existing 模式反之。
function onImportWsModeChange() {
  const mode = importWsMode();
  const nameInput = el('import-new-ws-name');
  const existingSel = el('import-existing-ws');
  if (nameInput) nameInput.disabled = (mode !== 'new');
  if (existingSel) existingSel.disabled = (mode !== 'existing');
}
function importWsMode() {
  const existing = el('import-ws-mode-existing');
  return (existing && existing.checked) ? 'existing' : 'new';
}
// 既有 workspace 下拉接真實 /workspaces（不寫死）；沿用清單 API 的 items 欄位。
async function populateImportWorkspaces() {
  const sel = el('import-existing-ws');
  if (!sel) return;
  try {
    const data = await getJson(API + '/workspaces?limit=200');
    const items = data.items || [];
    if (items.length === 0) {
      sel.innerHTML = '<option value="">（尚無既有 workspace）</option>';
      return;
    }
    sel.innerHTML = items.map(w =>
      '<option value="' + w.workspace_id + '">'
      + escHtml(w.workspace_name) + '（' + (w.patent_count ?? 0) + ' 件）</option>'
    ).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">載入失敗</option>';
  }
}
function showImportError(msg) {
  const box = el('import-error');
  if (!box) return;
  if (!msg) { box.hidden = true; box.textContent = ''; return; }
  box.hidden = false; box.textContent = msg;
}
// 開始匯入（單一動作鈕直接觸發）：讀當下表單 → 組 query（filename/purpose + workspace
// 二選一其一）→ 以檔案 raw body POST /imports → 拿 job_id 輪詢 /jobs。
// 不做二次確認；送出後立即 disable 按鈕並改字「匯入中…」防連點。422/413 顯示可讀中文，不吞錯。
async function startImport() {
  showImportError('');
  const outcome = collectImportChoice();
  if (outcome.error) { showImportError(outcome.error); return; }
  const choice = outcome.choice;
  const file = choice.file;

  // 組 query：filename／purpose 固定，workspace 二選一其一（new_workspace_name 或 workspace_id）。
  const qsParts = [
    'filename=' + encodeURIComponent(file.name),
    'purpose=' + encodeURIComponent(choice.purposeValue),
  ];
  if (choice.mode === 'new') {
    qsParts.push('new_workspace_name=' + encodeURIComponent(choice.newWorkspaceName));
  } else {
    qsParts.push('workspace_id=' + encodeURIComponent(choice.workspaceId));
  }
  const queryString = qsParts.join('&');

  // 進度移到右欄 AI 助手區（2026-07-26）：送出即關對話框，避免遮畫面；
  // 上傳與處理進度改 render 到 #import-progress-panel，關對話框後仍看得到（見 uploadImportViaXhr／pollImportJob）。
  closeImportDialog();
  const fileLabel = file.name;
  // 方案 B（2026-07-24）：上傳階段用 XHR 顯示真實進度條——fetch 無 upload 進度回調，
  // 大檔（如 53MB）上傳可能數分鐘，改用 XMLHttpRequest 的 upload.onprogress 讓使用者看到
  // 「上傳 X%」而非黑箱「匯入中…」；上傳完（onload）拿 job 無縫接 pollImportJob（處理階段進度）。
  uploadImportViaXhr(API + '/imports?' + queryString, file, fileLabel);
}

// XHR 上傳＋即時進度條：raw body 直送檔案，upload.onprogress 填右欄 #import-progress-panel。
// 上傳完成後解析回應接處理進度輪詢；錯誤路徑在右欄顯示可讀訊息（對話框已關，錨點改右欄）。
function uploadImportViaXhr(url, file, fileLabel) {
  const prog = el('import-progress-panel');
  // 進度/錯誤統一 render 到右欄面板；帶檔名讓使用者知道是哪次匯入（對話框已關看不到摘要）。
  const showPanel = function (html) { if (prog) prog.innerHTML = html; };
  const label = fileLabel ? ('<span style="color:var(--text-muted)">（' + escHtml(fileLabel) + '）</span>') : '';
  const xhr = new XMLHttpRequest();
  xhr.open('POST', url);
  // ⚠ 必須用 application/octet-stream（raw body 串流）：後端 imports 端點以 request.stream()
  //   讀原始 bytes（第一版刻意不引 python-multipart）。若帶 xlsx 的 file.type MIME，
  //   某些代理/ASGI 層會把 body 當需 multipart 解析而讀不到內容 → blob 存成 0 bytes、匯入 0 筆
  //   （2026-07-26 實測：python 直送 octet-stream 成功存 blob，前端帶 file.type 則 blob 空）。
  xhr.setRequestHeader('Content-Type', 'application/octet-stream');

  // 上傳進度：loaded/total → 百分比進度條（沿用既有 .progress-bar-* 樣式）。
  xhr.upload.onprogress = function (e) {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      const mb = (e.loaded / 1048576).toFixed(1);
      const totalMb = (e.total / 1048576).toFixed(1);
      showPanel('<div class="hint">上傳檔案中… ' + pct + '% ' + label + '（' + mb + ' / ' + totalMb
        + ' MB，大檔需數分鐘）</div>'
        + '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>');
    } else {
      showPanel('<div class="hint">上傳檔案中… ' + label + '</div>');
    }
  };
  // 上傳完成、等後端建 job：切到「處理中」提示，避免使用者以為卡住。
  xhr.upload.onload = function () {
    showPanel('<div class="hint">上傳完成，後端建立匯入工作中… ' + label + '</div>');
  };

  xhr.onload = function () {
    if (xhr.status >= 200 && xhr.status < 300) {
      let job = null;
      try { job = JSON.parse(xhr.responseText); } catch (_) {}
      if (job && job.job_id) {
        pollImportJob(job.job_id, fileLabel);  // 無縫接處理階段進度（右欄面板）
      } else {
        showPanel('<div class="task-detail-error">匯入回應解析失敗</div>');
      }
    } else {
      let err = {};
      try { err = JSON.parse(xhr.responseText); } catch (_) {}
      showPanel('<div class="task-detail-error">' + escHtml(importErrorMessage(xhr.status, err)) + '</div>');
    }
  };
  xhr.onerror = function () { showPanel('<div class="task-detail-error">連線錯誤：上傳失敗</div>'); };
  xhr.ontimeout = function () { showPanel('<div class="task-detail-error">上傳逾時，請重試</div>'); };
  xhr.send(file);
}
// 錯誤碼轉可讀中文：422（副檔名／workspace 二選一互斥／空檔）、413（過大），其餘照原訊息。
function importErrorMessage(status, err) {
  const detail = (err && err.detail) ? (typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail)) : '';
  if (status === 422) return '無法匯入（422）：' + (detail || '檔案格式或 workspace 選擇不符（副檔名須為 .xlsx/.csv/.txt/.xml，且 workspace 僅能擇一）。');
  if (status === 413) return '檔案過大（413）：' + (detail || '超過上傳容量上限。');
  return '匯入失敗（' + status + '）：' + (detail || '請稍後再試。');
}
// 輪詢匯入 job（GET /jobs/{id}）：以統一進度元件呈現進度／階段／已耗時；完成顯示匯入統計並刷新 workspace 下拉。
// 匯入是對話框（不隨 nav／workspace 切換而消失），故另記自己那條 timer id，
// 關閉對話框時以 clearTimer 單獨停掉；排程本身仍走同一個註冊表，不另立機制。
let importTimerId = null;
async function pollImportJob(jobId, fileLabel) {
  const prog = el('import-progress-panel');
  const started = Date.now();
  const label = fileLabel ? ('<span style="color:var(--text-muted)">（' + escHtml(fileLabel) + '）</span>') : '';
  async function tick() {
    // 進度已移到右欄面板，不再綁對話框開關；面板不存在（理論上不會）才停。
    if (!prog) return;
    try {
      const j = await getJson(API + '/jobs/' + jobId);
      prog.innerHTML = jobProgressCardHtml(j, started);
      if (j.status === 'succeeded') {
        // 完成結果（統計＋前往該 workspace 快捷）也 render 到右欄面板。
        prog.innerHTML = importResultHtml(j) || jobProgressCardHtml(j, started);
        // 匯入完成刷新頂列 workspace 下拉（新建的要出現、圈進的可選）。
        await loadWorkspaces();
        return;
      }
      if (['failed', 'cancelled'].includes(j.status)) {
        prog.innerHTML = '<div class="task-detail-error">匯入工作失敗 ' + label + '：'
          + escHtml(j.error_message || '（無錯誤訊息）') + '</div>';
        return;
      }
    } catch (e) {
      prog.innerHTML = '<div class="task-detail-error">查詢匯入狀態失敗：' + escHtml(e.message) + '</div>';
      return;
    }
    importTimerId = registerTimer(tick, 2000);
  }
  tick();
}
// 完成結果 HTML（回傳字串，供右欄面板 render；2026-07-26 進度移到 AI 助手區後改回傳字串）：
// 讀 job.result 的匯入統計欄（inserted/matched_existing/updated/patent_ids），欄名以
// wips_importer summary 為準。目標 workspace 讀 result.workspace_id／result.workspace，
// 並提供「前往該 workspace 專利總覽」快捷（切 workspace + 導覽到 patents）。
function importResultHtml(j) {
  const r = j.result || {};
  if (!j.result || Object.keys(r).length === 0) {
    return '<div class="card import-result">'
      + '<div style="font-weight:600;color:var(--warn)">匯入完成，但後端尚未回傳結果</div>'
      + '<div style="margin-top:0.5rem;color:var(--text-muted)">job #' + escHtml(j.job_id || '') + ' 已成功，請檢查 workflow_outputs 或重新整理。</div>'
      + '</div>';
  }
  const patentCount = Array.isArray(r.patent_ids) ? r.patent_ids.length : (r.patent_ids ?? 0);
  const ws = r.workspace || {};
  const wsId = r.workspace_id ?? ws.workspace_id ?? null;
  const wsName = ws.workspace_name || (wsId !== null ? ('#' + wsId) : '（未指定）');
  const shortcut = wsId !== null
    ? '<div style="margin-top:0.7rem"><button class="btn btn-primary" id="btn-goto-imported-ws"'
      + ' onclick="gotoImportedWorkspace(' + wsId + ')">前往該 workspace 專利總覽</button></div>'
    : '';
  return '<div class="card import-result">'
    + '<div style="font-weight:600;color:var(--ok)">✓ 匯入完成</div>'
    + '<div class="stat-grid">'
    + '<span class="k">新增（inserted）</span><span>' + (r.inserted ?? 0) + '</span>'
    + '<span class="k">命中既有（matched_existing）</span><span>' + (r.matched_existing ?? 0) + '</span>'
    + '<span class="k">更新（updated）</span><span>' + (r.updated ?? 0) + '</span>'
    + '<span class="k">本批專利數（patent_ids）</span><span>' + patentCount + '</span>'
    + '</div>'
    // 公司名歸戶統計（2026-07-30，規格 applicant-code-grouping-spec.md b5）：
    // ⚠ summary.alias_variants 早就存在但前端**零顯示**——自動歸戶了幾筆、
    // 建了幾組待確認組，使用者完全看不到（做了卻沒人知道的靜默成功）。
    + aliasVariantsHtml(r.alias_variants)
    + '<div style="margin-top:0.5rem">已加入 workspace <strong>' + escHtml(wsName) + '</strong>。</div>'
    + shortcut
    + '</div>';
}
// 公司名歸戶統計（匯入結果卡的一段）。
// ⚠ 措辭不提 AI／建議／草稿——本路徑依 WIPS 代碼推導，是確定性規則。
// 待確認組要**明確提示去哪確認**，否則使用者不知道有事情待辦。
function aliasVariantsHtml(av) {
  if (!av || typeof av !== 'object') return '';
  const inserted = av.inserted || 0;
  const created = (av.created_groups || []).length;
  const manual = (av.manual_review || []).length;
  // L2 疑似（規格批次 a）：只提示不寫入——忽略後綴後不同法人可能同 key，
  // 誤歸戶比漏歸戶難修，故一律由使用者確認。
  const suspected = (av.suspected || []).length;
  if (!inserted && !created && !manual && !suspected) return '';
  let html = '<div class="stat-grid" style="margin-top:0.6rem">'
    + '<span class="k">公司名自動歸戶</span><span>' + inserted + ' 筆</span>';
  if (created) {
    html += '<span class="k">待確認代碼組</span><span>' + created
      + ' 組（依 WIPS 代碼建立，中文名待補）</span>';
  }
  if (suspected) {
    html += '<span class="k">疑似同一家</span><span>' + suspected
      + ' 筆（僅標示，未歸戶）</span>';
  }
  if (manual) html += '<span class="k">需人工複核</span><span>' + manual + ' 筆</span>';
  html += '</div>';
  if (created || suspected) {
    html += '<p class="hint" style="padding:0.35rem 0 0">'
      + '到「瀏覽專利 → 專利權人代碼與中文名」處理'
      + (created ? '：在「資料庫已有的代碼」補中文名後按確認' : '')
      + (suspected ? '；疑似項在待補清單標出，確認後才歸戶' : '')
      + '。未確認前不會進入專利表與報表顯示。</p>';
  }
  return html;
}

// 快捷：關閉對話框 → 切到該 workspace → 導覽到專利總覽。
function gotoImportedWorkspace(workspaceId) {
  closeImportDialog();
  const sel = el('workspace-select');
  if (sel) sel.value = String(workspaceId);
  state.workspaceId = workspaceId;
  state.isGlobalWs = false;   // 切到匯入的一般 workspace：清全庫旗標。
  state.patentsOffset = 0;
  state.topicFilterKey = null;
  navTo('patents');
}

// ══════════ 初始化 ══════════
loadWorkspaces();
fetchTasks();
connectSSE();
setInterval(fetchTasks, 60000);  // 保底整體重整
</script>
</body>
</html>
