name: OpenSpec Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  openspec-strict:
    name: OpenSpec strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.8.0

      - name: Validate OpenSpec
        run: openspec validate --all --strict --no-interactive
