# Standalone branch Compose file for Supabase-backed validation.
#
# Usage on Lightning:
#   git switch feat/ai-company-normalization-review
#   docker compose -f docker-compose.branch.supabase.yml up -d --build backend worker
#
# Host entrypoint:
#   http://127.0.0.1:8001
name: patent-ppt-branch

x-branch-build: &branch-build
  context: .
  dockerfile: Dockerfile
  args:
    UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.27}
    PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
    APP_UID: ${APP_UID:-10001}
    APP_GID: ${APP_GID:-10001}

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  PGOPTIONS: ${PGOPTIONS:--c search_path=core_layer,raw_layer,public}
  WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-120}
  MODEL_ARTIFACT_ROOT: ${CONTAINER_MODEL_ARTIFACT_ROOT:-/app/data/model_artifacts}
  PATENT_SBERTA_MODEL_DIR: ${PATENT_SBERTA_MODEL_DIR:-/app/data/model_artifacts/PatentSBERTa}
  PATENT_SBERTA_MODEL_URL: ${PATENT_SBERTA_MODEL_URL:-}
  PATENT_SBERTA_MODEL_SHA256: ${PATENT_SBERTA_MODEL_SHA256:-}
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"

services:
  backend:
    build: *branch-build
    image: ${BRANCH_APP_IMAGE:-patent-backend-worker:branch}
    container_name: patent-branch-backend
    environment:
      <<: *app-environment
      APP_ROLE: backend
      PORT: "8000"
    command: ["python", "-m", "backend.app.deploy"]
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BRANCH_BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${OUTPUT_HOST_PATH:-./output}:/app/output
      - ./backend/app/static:/app/backend/app/static
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    build: *branch-build
    image: ${BRANCH_APP_IMAGE:-patent-backend-worker:branch}
    container_name: patent-branch-worker
    environment:
      <<: *app-environment
      APP_ROLE: worker
      WORKER_ID: ${BRANCH_WORKER_ID:-patent-branch-worker-1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-3}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-1800}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
    command: ["python", "-m", "backend.app.deploy"]
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${OUTPUT_HOST_PATH:-./output}:/app/output
    init: true
    stop_grace_period: 2m
    restart: unless-stopped
