# Alembic configuration for the patent tool.
# The database URL is resolved at runtime in alembic/env.py from
# DATABASE_URL / PG* environment variables (see backend/app/db/connection.py),
# so it is intentionally left blank here.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set programmatically in env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
