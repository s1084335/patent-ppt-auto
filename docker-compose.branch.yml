# Branch-local overlay for running a feature branch next to the mainline stack.
#
# Typical Supabase-backed branch run:
#   docker compose -f docker-compose.yml -f docker-compose.supabase.yml -f docker-compose.branch.yml up -d --build backend worker
#
# Host ports:
#   mainline backend: 127.0.0.1:8000
#   branch backend : 127.0.0.1:8001
name: patent-ppt-branch

services:
  postgres:
    ports: !override
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${BRANCH_POSTGRES_HOST_PORT:-5434}:5432"

  backend:
    container_name: patent-branch-backend
    image: ${BRANCH_APP_IMAGE:-patent-backend-worker:branch}
    environment:
      APP_ROLE: backend
      PORT: "8000"
    ports: !override
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BRANCH_BACKEND_HOST_PORT:-8001}:8000"

  worker:
    container_name: patent-branch-worker
    image: ${BRANCH_APP_IMAGE:-patent-backend-worker:branch}
    environment:
      APP_ROLE: worker
      WORKER_ID: ${BRANCH_WORKER_ID:-patent-branch-worker-1}

volumes:
  pgdata:
    name: patent_branch_pgdata
