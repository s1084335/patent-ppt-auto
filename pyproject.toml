[project]
name = "patent-ppt-automation"
version = "0.1.0"
description = "Patent data import, normalization, analysis, and report automation."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "bertopic>=0.17.4",
    "fastapi>=0.116",
    "gensim>=4.4.0",
    "huggingface-hub>=1.23.0",
    "kaleido>=1.3.0",
    "mcp>=1.28.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.0",
    "pandas>=3.0.3",
    # deck 目視截圖與圖表字級量測（B 案）。⚠ 套件由此宣告，**瀏覽器本體不在內**
    # ——browsers 另裝（`playwright install chromium`）或以
    # `PLAYWRIGHT_BROWSERS_PATH` 指向既有安裝，見 skills/…/browser_env.py。
    # 🔴 chromium 版本是 getBBox 量測的變因（deck design 4c-1），換版要重驗。
    "playwright>=1.62.0",
    "plotly>=6.8.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.2.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.1",
    # ⚠ 2026-08-20 移除 python-pptx：PPT 交付線停產、HTML 為唯一交付物，
    # 全庫已無任何 `import pptx`（實測掃過 backend／scripts／tests）。
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "torch>=2.13.0",
    "transformers>=5.13.1",
    "uvicorn>=0.35",
]

[tool.uv]
package = false

[tool.uv.sources]
# GPU runtime：正式 Lightning AI 部署仍需要 CUDA-enabled torch。
# Image 瘦身靠排除模型與資料檔，不用 CPU-only torch 犧牲 embedding GPU 功能。
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
