[project]
name = "patent-ppt-automation"
version = "0.1.0"
description = "Patent data import, normalization, analysis, and report automation."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "kaleido>=1.3.0",
    "openpyxl>=3.1.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "psycopg[binary]>=3.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
