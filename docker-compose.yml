# Patent tool backend / worker / PostgreSQL integration stage.
# Local DB mode: containers use postgres:5432, host tools use localhost:5433.
# External DB mode: add docker-compose.supabase.yml and set DATABASE_URL.
#
# Usage:
#   copy .env.example to .env and set DATABASE_URL or POSTGRES_PASSWORD
#   docker compose up -d --build postgres backend worker
# Migration remains an explicit one-shot command and never runs at service startup.

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-}
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-patent_ppt}
  PGUSER: ${POSTGRES_USER:-postgres}
  PGPASSWORD: ${POSTGRES_PASSWORD:-change_me}
  PGOPTIONS: -c search_path=core_layer,raw_layer,public
  WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-120}
  MODEL_ARTIFACT_ROOT: ${CONTAINER_MODEL_ARTIFACT_ROOT:-/app/data/model_artifacts}
  PATENT_SBERTA_MODEL_DIR: ${PATENT_SBERTA_MODEL_DIR:-/app/data/model_artifacts/PatentSBERTa}
  PATENT_SBERTA_MODEL_URL: ${PATENT_SBERTA_MODEL_URL:-}
  PATENT_SBERTA_MODEL_SHA256: ${PATENT_SBERTA_MODEL_SHA256:-}
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"

services:
  postgres:
    # PostgreSQL 18 with pgvector preinstalled; required by migration 0004
    # for core_layer.patent_embeddings.embedding_vector VECTOR(768).
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.5-pg18-trixie}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patent_ppt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql (new 18+ layout).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-patent_ppt}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.27}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: ${APP_IMAGE:-patent-backend-worker:local}
    environment:
      <<: *app-environment
      APP_ROLE: backend
      PORT: ${BACKEND_CONTAINER_PORT:-8000}
    command: ["python", "-m", "backend.app.deploy"]
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${OUTPUT_HOST_PATH:-./output}:/app/output
      # Mount static assets in development so UI edits can refresh without rebuild.
      - ./backend/app/static:/app/backend/app/static
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.27}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.13-slim-bookworm}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: ${APP_IMAGE:-patent-backend-worker:local}
    environment:
      <<: *app-environment
      APP_ROLE: worker
      WORKER_ID: ${WORKER_ID:-patent-worker-1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-3}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-1800}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
    command: ["python", "-m", "backend.app.deploy"]
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${OUTPUT_HOST_PATH:-./output}:/app/output
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  pgdata:
